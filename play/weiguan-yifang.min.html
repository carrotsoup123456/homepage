  function cityWallJie(x, w, broken, scale) {
    const h = 46 * (scale || 1), bw = w * (scale || 1);
    let merl = '';
    for (let i = 0; i < Math.floor(bw / 7); i++) {
      if (broken && i > 0 && i < 3) continue;
      merl += `<rect x="${(i * 7).toFixed(0)}" y="${(-h - 5).toFixed(0)}" width="4.5" height="5" fill="#b9ae90" stroke="${INK}" stroke-width="0.6"/>`;
    }
    return `<g transform="translate(${x.toFixed(1)},${0}) scale(1)">
      <rect x="0" y="${(-h).toFixed(0)}" width="${bw.toFixed(0)}" height="${h.toFixed(0)}" fill="#c2b79a" stroke="${INK}" stroke-width="1"/>
      ${merl}
      <path d="M${(bw * 0.36).toFixed(0)},${(-h).toFixed(0)} l0,-9 l${(bw * 0.28).toFixed(0)},0 l0,9 Z" fill="${TILE}" stroke="${INK}" stroke-width="0.9"/>
      <line x1="${(bw * 0.36).toFixed(0)}" y1="${(-h - 9).toFixed(0)}" x2="${(bw * 0.64).toFixed(0)}" y2="${(-h - 9).toFixed(0)}" stroke="${INK}" stroke-width="1.6"/>
      <path d="M${(bw * 0.40).toFixed(0)},0 l0,${(-h * 0.55).toFixed(0)} q${(bw * 0.1).toFixed(0)},${(-h * 0.28).toFixed(0)} ${(bw * 0.2).toFixed(0)},0 l0,${(h * 0.55).toFixed(0)} Z" fill="${INK2}" stroke="${INK}" stroke-width="0.9"/>
    </g>`;
  }

  // 勾线云（内部留白）
  function cloudJie(x, y, s, op) {
    return `<g transform="translate(${x},${y}) scale(${s})" opacity="${op}">
      <path d="M-22,0 Q-26,-8 -16,-9 Q-13,-17 -3,-14 Q4,-19 11,-12 Q21,-13 19,-3 Q24,3 15,4 Z" fill="none" stroke="${INK}" stroke-width="1" opacity="0.55"/>
      <path d="M-14,-2 Q-6,-6 2,-3" fill="none" stroke="${INK}" stroke-width="0.7" opacity="0.4"/>
    </g>`;
  }

  // 运河（界画）：青灰水道 + 波纹 + 两岸堤石，纵向斜切画面，画出纵深
  function canalJie(x0, y0, x1, y1, wTop, wBot) {
    // 河岸线：近端(x0,y0) 宽 wTop，远端(x1,y1) 宽 wBot（斜轴测里越远越窄）
    const dx = x1 - x0, dy = y1 - y0;
    const L = Math.sqrt(dx * dx + dy * dy);
    const nx = -dy / L, ny = dx / L;      // 河道法向
    const p = (v) => v.toFixed(1);
    const ax = x0 + nx * wTop / 2, ay = y0 + ny * wTop / 2;
    const bx = x0 - nx * wTop / 2, by = y0 - ny * wTop / 2;
    const cx = x1 - nx * wBot / 2, cy = y1 - ny * wBot / 2;
    const dx2 = x1 + nx * wBot / 2, dy2 = y1 + ny * wBot / 2;
    const s = `<path d="M${p(ax)},${p(ay)} L${p(bx)},${p(by)} L${p(cx)},${p(cy)} L${p(dx2)},${p(dy2)} Z" fill="${WATER}" stroke="${INK}" stroke-width="1"/>`;
    // 波纹（沿河道的短横线，越往远越密越浅）
    let ripple = '';
    for (let i = 0; i < 11; i++) {
      const t = i / 10;
      const mx = x0 + (x1 - x0) * t, my = y0 + (y1 - y0) * t;
      const wHalf = (wTop + (wBot - wTop) * t) / 2 * 0.62;
      ripple += `<line x1="${p(mx - wHalf)}" y1="${p(my)}" x2="${p(mx + wHalf)}" y2="${p(my)}" stroke="${INK}" stroke-width="0.6" opacity="${(0.5 - t * 0.32).toFixed(2)}"/>`;
    }
    // 光斑（水面反光，随水流一起动）
    const glint = `<ellipse cx="${p(x0 + dx * 0.45)}" cy="${p(y0 + dy * 0.45)}" rx="3.5" ry="1.5" fill="#ffffff" opacity="0.26"/>`;
    // 第二批·水流动：SMIL 沿河道方向平移一个波纹间距，无缝循环（8 单位/秒）
    // 相邻波纹间距 = 河道长 / 10；translate 到 (dx/10, dy/10) 后波纹 i 正好落在波纹 i+1 的位置
    const ripDur = (L / 10) / 8;
    const ripG = `<g class="water-ripple"><animateTransform attributeName="transform" type="translate" from="0 0" to="${p(dx / 10)} ${p(dy / 10)}" dur="${ripDur.toFixed(2)}s" repeatCount="indefinite"/>${ripple}${glint}</g>`;
    // 两岸堤石（近端较宽的石砌边）
    const st1 = `<path d="M${p(x0 + nx * wTop / 2)},${p(y0 + ny * wTop / 2)} L${p(x1 + nx * wBot / 2)},${p(y1 + ny * wBot / 2)} L${p(x1 + nx * (wBot / 2 + 6))},${p(y1 + ny * (wBot / 2 + 6))} L${p(x0 + nx * (wTop / 2 + 7))},${p(y0 + ny * (wTop / 2 + 7))} Z" fill="#b9ae90" stroke="${INK}" stroke-width="0.8"/>`;
    const st2 = `<path d="M${p(x0 - nx * wTop / 2)},${p(y0 + ny * wTop / 2)} L${p(x1 - nx * wBot / 2)},${p(y1 + ny * wBot / 2)} L${p(x1 - nx * (wBot / 2 + 6))},${p(y1 + ny * (wBot / 2 + 6))} L${p(x0 - nx * (wTop / 2 + 7))},${p(y0 + ny * (wTop / 2 + 7))} Z" fill="#b9ae90" stroke="${INK}" stroke-width="0.8"/>`;
    return `<g>${st1}${st2}${s}${ripG}</g>`;
  }

  // 码头（界画）：木板平台 + 系船桩 + 泊船 + 跳板，近景一角
  function wharfJie(x, y, s, hasBoat) {
    const p = (v) => v.toFixed(1);
    const L = [];
    // 木平台（斜轴测平行四边形）
    L.push(`<path d="M${p(-40)},${p(-4)} L${p(40)},${p(-4)} L${p(50)},${p(-18)} L${p(-30)},${p(-18)} Z" fill="#c8b890" stroke="${INK}" stroke-width="1"/>`);
    for (let i = 0; i < 5; i++) {
      const t = i / 4;
      L.push(`<line x1="${p(-40 + 80 * t)},${p(-4)}" x2="${p(-30 + 80 * t)},${p(-18)}" stroke="${INK}" stroke-width="0.6" opacity="0.5"/>`);
    }
    // 系船桩 ×2
    L.push(`<rect x="${p(-36)}" y="${p(-9)}" width="4" height="5" fill="#8a6a3a" stroke="${INK}" stroke-width="0.6"/>`);
    L.push(`<rect x="${p(32)}" y="${p(-9)}" width="4" height="5" fill="#8a6a3a" stroke="${INK}" stroke-width="0.6"/>`);
    // 泊船（小船 + 篷）
    if (hasBoat) {
      L.push(`<path d="M${p(-26)},${p(2)} L${p(30)},${p(2)} L${p(24)},${p(8)} L${p(-18)},${p(8)} Z" fill="#8a6a3a" stroke="${INK}" stroke-width="0.9"/>`);
      L.push(`<path d="M${p(-6)},${p(-2)} Q${p(4)},${p(-10)} ${p(14)},${p(-2)} Z" fill="#d8c8a0" stroke="${INK}" stroke-width="0.8"/>`);
    }
    return `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${s.toFixed(2)})">${L.join('')}</g>`;
  }

  // 行船（界画）：梭形船体 + 拱篷 + 船尾摇橹船夫 —— 第二批动效
  // 局部坐标：船头朝 +x、水面线 y=0；船体整体由 animator 沿河道 translate + rotate + bob 驱动，
  // 橹（b-oar）由 animator 独立 rotate 摇橹。
  function boatJie(bid) {
    const p = (v) => v.toFixed(1);
    const limb = '#2f2a22';
    const hull = `<path d="M${p(18)},0 Q${p(8)},${p(-5)} ${p(-12)},${p(-3)} L${p(-18)},${p(-1)} Q${p(-8)},${p(5)} ${p(18)},0 Z" fill="#8a6a3a" stroke="${INK}" stroke-width="1"/>`;
    const canopy = `<path d="M${p(-1)},${p(-2)} Q${p(4)},${p(-10)} ${p(10)},${p(-2)} Z" fill="#d8c8a0" stroke="${INK}" stroke-width="0.8"/>`;
    const man = `<circle cx="${p(-11)}" cy="${p(-9)}" r="2.2" fill="${limb}"/>
      <path d="M${p(-11)},${p(-7)} L${p(-11)},${p(-2)}" stroke="${limb}" stroke-width="1.8" stroke-linecap="round"/>`;
    const oar = `<line x1="${p(-16)}" y1="${p(-3)}" x2="${p(-25)}" y2="${p(5)}" stroke="#5a3a1a" stroke-width="1.5" stroke-linecap="round"/>`;
    return `<g class="boat" data-bid="${bid}"><g class="b-hull">${hull}${canopy}${man}</g><g class="b-oar">${oar}</g></g>`;
  }

  // 行船数据源：繁荣度 → 船数（0~3），荒年（<0.2）河上没船；返回 { items: 深度排序用, anim: 动画驱动用 }
  function buildBoats(gs, ctx) {
    const v = gs.values;
    const prosperity = clamp((v.population + v.people + v.tresury) / 300, 0, 1);
    const flags = (gs.flags && gs.flags.has) ? gs.flags : null;
    const hasWharf = flags ? flags.has('canal_wharf') : false;
    const items = [], anim = [];
    if (!hasWharf || prosperity < 0.2) return { items, anim };
    const nBoats = 1 + Math.round(prosperity * 2);   // 0.2~0.5→2, 0.5+→3（封顶 3）
    // 河道端点（与 buildFgItems 里 canalJie 的坐标严格一致）
    const a = proj(-150, 120), b = proj(-52, 470);
    const L = Math.hypot(b.x - a.x, b.y - a.y);
    const angDeg = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;   // 船体旋转对准河道
    const d = 300, scale = scaleOf(d);              // 固定深度（河道中段，避免每帧跨层重排）
    for (let i = 0; i < nBoats; i++) {
      const bid = 'boat' + i;
      const t0 = i * (0.4 / Math.max(1, nBoats - 1)) + rnd(i * 13 + 5) * 0.6;   // 初始相位随机（t∈[0,1] 沿河道，不上岸）
      const dir = i % 2 === 0 ? 1 : -1;
      items.push({ d, t: 1, s: boatJie(bid) });
      anim.push({ bid, x0: a.x, y0: a.y, x1: b.x, y1: b.y, L,
        t: t0, dir, speed: 16, scale, angDeg, phase: rnd(i * 7 + 1) * Math.PI * 2 });
    }
    return { items, anim };
  }

  // 麻雀（第三批·活气）：一笔画鸟，供天空层 CSS 飞掠（内层 g 承载动画，外层 g 定位）
  function sparrowJie(x, y, delay) {
    const p = (v) => v.toFixed(1);
    return `<g transform="translate(${p(x)},${p(y)})"><g class="fx-bird" style="animation-delay:${delay.toFixed(1)}s">
      <path d="M0,0 q3,-2.2 6,0 q3,2.2 0,1.2 q-3,1 -6,-1.2 Z" fill="${INK}" stroke="${INK}" stroke-width="0.4"/>
      <path d="M1.5,-0.8 q-2,-2.2 -4.5,-1.2 M4,-0.6 q3,-3 5.5,-1.8" fill="none" stroke="${INK}" stroke-width="0.5" stroke-linecap="round"/>
    </g></g>`;
  }

  // 鸡（第三批）：圆身 + 头冠 + 尾羽 + 两条腿，地面走动啄食；脚底 (0,0)
  function chickenJie(bid) {
    const p = (v) => v.toFixed(1);
    return `<g class="chicken" data-bid="${bid}"><g class="c-body">
      <path d="M-6,-5 Q-11,-8 -9,-1 Q-11,0 -6,-1" fill="#c8a860" stroke="${INK}" stroke-width="0.6"/>
      <ellipse cx="0" cy="-5" rx="6" ry="4.6" fill="#e0d0a8" stroke="${INK}" stroke-width="0.8"/>
      <circle cx="7" cy="-9.5" r="2.5" fill="#e0d0a8" stroke="${INK}" stroke-width="0.6"/>
      <path d="M6.3,-11.8 l0,-2 l1.5,0 l-0.8,1.5 Z" fill="#a03020"/>
      <path d="M9,-9 l2.2,-0.3" stroke="#c86030" stroke-width="0.9" stroke-linecap="round"/>
      <circle cx="9.2" cy="-10" r="0.5" fill="${INK}"/>
      <g class="c-leg-l"><line x1="-2.5" y1="-1" x2="-3" y2="2.5" stroke="#8a6a3a" stroke-width="1.2"/><line x1="-3" y1="2.5" x2="-4.2" y2="2.5" stroke="#8a6a3a" stroke-width="1"/></g>
      <g class="c-leg-r"><line x1="2.5" y1="-1" x2="3" y2="2.5" stroke="#8a6a3a" stroke-width="1.2"/><line x1="3" y1="2.5" x2="4.2" y2="2.5" stroke="#8a6a3a" stroke-width="1"/></g>
    </g></g>`;
  }

  // 车（第三批）：板车 + 货 + 两个 SMIL 自转车轮 + 车把；车板中心 (0,0)
  function cartJie(bid) {
    const p = (v) => v.toFixed(1);
    const wheel = (cx) => `<g transform="translate(${p(cx)},2)"><g>
      <circle cx="0" cy="0" r="4" fill="none" stroke="${INK}" stroke-width="1.4"/>
      <line x1="0" y1="0" x2="0" y2="-4" stroke="${INK}" stroke-width="1"/>
      <line x1="0" y1="0" x2="4" y2="0" stroke="${INK}" stroke-width="1"/>
      <line x1="0" y1="0" x2="-3.4" y2="2" stroke="${INK}" stroke-width="0.9"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
    </g></g>`;
    return `<g class="cart" data-bid="${bid}"><g class="c-body">
      <rect x="-12" y="-8" width="24" height="6" rx="1" fill="#a07040" stroke="${INK}" stroke-width="0.8"/>
      <path d="M-10,-8 Q-6,-16 2,-14 Q8,-16 12,-8 Z" fill="#c8b060" stroke="${INK}" stroke-width="0.7"/>
      <line x1="-10" y1="-8" x2="0" y2="-14" stroke="${INK}" stroke-width="0.4" opacity="0.5"/>
      <line x1="12" y1="-5" x2="22" y2="-10" stroke="#5a3a1a" stroke-width="1.2"/>
      <line x1="22" y1="-10" x2="24" y2="-12" stroke="#5a3a1a" stroke-width="1"/>
      ${wheel(-7)}${wheel(7)}
    </g></g>`;
  }

  // 马（第三批）：身 + 颈头 + 四腿 + 尾 + 骑者，地面疾行；脚底 (0,0)
  function horseJie(bid) {
    const p = (v) => v.toFixed(1);
    return `<g class="horse" data-bid="${bid}"><g class="c-body">
      <ellipse cx="0" cy="-16" rx="14" ry="8" fill="#8a5a3a" stroke="${INK}" stroke-width="0.8"/>
      <path d="M11,-18 Q21,-32 25,-29 Q21,-23 13,-20 Z" fill="#8a5a3a" stroke="${INK}" stroke-width="0.8"/>
      <circle cx="25" cy="-28" r="3" fill="#8a5a3a" stroke="${INK}" stroke-width="0.6"/>
      <path d="M-13,-15 Q-19,-11 -21,-8" fill="none" stroke="${INK}" stroke-width="0.8"/>
      <g class="c-leg-l"><line x1="-7" y1="-9" x2="-9" y2="0" stroke="#6a4a2a" stroke-width="1.6"/></g>
      <g class="c-leg-r"><line x1="7" y1="-9" x2="9" y2="0" stroke="#6a4a2a" stroke-width="1.6"/></g>
      <g class="c-leg-l2"><line x1="-3" y1="-9" x2="-4" y2="0" stroke="#6a4a2a" stroke-width="1.6"/></g>
      <g class="c-leg-r2"><line x1="3" y1="-9" x2="5" y2="0" stroke="#6a4a2a" stroke-width="1.6"/></g>
      <g class="c-rider"><path d="M-2,-24 L-4,-33" stroke="#2f6a52" stroke-width="5" stroke-linecap="round"/><circle cx="-4" cy="-37" r="3.6" fill="#e0c8a0" stroke="${INK}" stroke-width="0.6"/><circle cx="-6" cy="-39" r="3" fill="#2f2a22"/></g>
    </g></g>`;
  }

  // 炊烟（第三批）：从屋脊升起、3s 淡出，负 delay 错开；只给整宅（非破败/着火）
  function chimneySmokeJie(x, y, delay) {
    const p = (v) => v.toFixed(1);
    return `<g class="fx-rise" style="animation-delay:${delay.toFixed(1)}s" opacity="0.45">
      <g transform="translate(${p(x)},${p(y)})">
        <ellipse cx="0" cy="0" rx="3" ry="2" fill="#999"/>
        <ellipse cx="-1.5" cy="-7" rx="4" ry="2.6" fill="#aaa"/>
        <ellipse cx="1" cy="-14" rx="3.5" ry="2.2" fill="#bbb"/>
      </g></g>`;
  }

  // 第三批·地面活物数据源：鸡（2 只，繁荣≥0.3）+ 车（1 辆，繁荣>0.5）+ 马（1 匹，繁荣>0.75）
  function buildGround(gs, ctx) {
    const v = gs.values;
    const prosperity = clamp((v.population + v.people + v.tresury) / 300, 0, 1);
    const items = [], anim = [];
    if (prosperity >= 0.3) {
      // 鸡：分布在近、中、远三段纵深，别都挤在前景
      const chickD = [24, 120, 260];
      for (let i = 0; i < 3; i++) {
        const bid = 'chk' + i;
        const d = chickD[i] + rnd(i * 3 + 1) * 30;
        const wx = (i === 0 ? -130 : (i === 1 ? 20 : 90)) + rnd(i * 11 + 5) * 60;
        const pt = proj(wx, d);
        items.push({ d, t: 2, s: chickenJie(bid) });
        anim.push({ kind: 'chicken', bid, x: pt.x, y: pt.y, scale: scaleOf(d),
          dir: i % 2 ? -1 : 1, phase: rnd(i * 5 + 2) * 6.28, speed: 1.5,
          xMin: pt.x - 60, xMax: pt.x + 60 });
      }
    }
    if (prosperity > 0.5) {
      // 车：加深纵深分布（两辆，一近一中远），别只在一处
      for (let i = 0; i < 2; i++) {
        const bid = 'cart' + i;
        const d = (i === 0 ? 40 : 210) + rnd(i * 13 + 1) * 20;
        const wx = (i === 0 ? -70 : 60) + (rnd(13 + i * 7) - 0.5) * 180;
        const pt = proj(wx, d);
        items.push({ d, t: 2, s: cartJie(bid) });
        anim.push({ kind: 'cart', bid, x: pt.x, y: pt.y, scale: scaleOf(d),
          dir: (i % 2 ? -1 : 1), phase: 0, speed: 6.3, xMin: pt.x - 120, xMax: pt.x + 120 });
      }
    }
    if (prosperity > 0.75) {
      const bid = 'horse0';
      const d = 80, wx = 180 + (rnd(17) - 0.5) * 140;   // 马固定 d=80，wx 在街道域内抖
      const pt = proj(wx, d);
      items.push({ d, t: 2, s: horseJie(bid) });
      anim.push({ kind: 'horse', bid, x: pt.x, y: pt.y, scale: scaleOf(d) * 0.9,
        dir: -1, phase: 0, speed: 13.5, xMin: pt.x - 260, xMax: pt.x + 60 });
    }
    return { items, anim };
  }

  const SK = {            // 骨架关键点（脚底 0,0）
    ankle: -5, knee: -14, hip: -22, waist: -25,
    shoulder: -34, elbow: -27, wrist: -20, neck: -35,
    head: -40, headR: 5.5, crown: -48
  };
  const LW = { torso: 6.0, upper: 3.8, fore: 3.4, thigh: 4.6, shin: 4.0, joint: 2.6 };

  const ROLE = {
    official: { robe: '#2f6a52', sash: '#e8cf8a', hat: 'wusha', buzi: true, walk: { sp: 7, fq: 1.1, leg: 12, arm: 8, bob: 0.8 } },
    yamen:    { robe: '#8a4a3a', sash: '#d8c8a0', hat: 'zaoli', tool: 'staff', walk: { sp: 9, fq: 1.6, leg: 28, arm: 18, bob: 0.9 } },
    soldier:  { robe: '#8a4a3a', sash: '#d8c8a0', hat: 'doumu', tool: 'spear', armor: true, walk: { sp: 8.5, fq: 1.5, leg: 26, arm: 16, bob: 0.9 } },
    patrol:   { robe: '#3a5a7a', sash: '#a03020', hat: 'zaoli', tool: 'saber', armor: true, walk: { sp: 7.5, fq: 1.3, leg: 22, arm: 12, bob: 0.7 } },  // 巡逻官兵：步幅稳、摆臂小
    commoner: { robe: '#c8a860', sash: '#8a4a3a', hat: 'ruanjin', walk: { sp: 8, fq: 1.4, leg: 24, arm: 20, bob: 0.9 } },
    stroller: { robe: '#7a9a7a', sash: '#c8a860', hat: 'ruanjin', tool: 'fan', walk: { sp: 5.5, fq: 1.0, leg: 16, arm: 6, bob: 0.6 } },   // 游玩闲人：慢走、摇扇
    peddler:  { robe: '#c8a860', sash: '#8a4a3a', hat: 'futou', tool: 'carry', walk: { sp: 6, fq: 1.2, leg: 20, arm: 6, bob: 1.6 } },
    farmer:   { robe: '#c8a860', sash: '#8a4a3a', hat: 'douli', tool: 'hoe', rolled: true, walk: { sp: 7.5, fq: 1.3, leg: 22, arm: 16, bob: 1.0 } },
    vegFarmer:{ robe: '#a8a860', sash: '#5a6a3a', hat: 'douli', tool: 'vegLoad', rolled: true, walk: { sp: 6, fq: 1.1, leg: 20, arm: 5, bob: 1.4 } }, // 挑菜农夫：扁担两筐青菜
    refugee:  { robe: '#9a8a70', sash: '#7a6a52', hat: 'none', tattered: true, tool: 'stick', walk: { sp: 5, fq: 0.9, leg: 16, arm: 6, bob: 1.2 } },
    child:    { robe: '#c8a860', sash: '#8a4a3a', hat: 'ruanjin', small: 0.6, walk: { sp: 5, fq: 2.2, leg: 30, arm: 35, bob: 1.4 } },
    bandit:   { robe: '#5a4020', sash: '#3a2a1a', hat: 'toujin', mask: true, tool: 'knife', walk: { sp: 6.5, fq: 1.8, leg: 26, arm: 14, bob: 1.1 } },
    beggar:   { robe: '#9a8a70', sash: '#7a6a52', hat: 'none', tattered: true, tool: 'bowl', sit: true, walk: { sp: 0, fq: 0, leg: 0, arm: 0, bob: 0 } },
  };

  function hatOf(kind, col) {
    switch (kind) {
      case 'wusha':   // 乌纱帽：圆顶 + 两侧硬翅
        return `<path d="M-5,-43 q5,-5 10,0 Z" fill="#2a2a30" stroke="${INK2}" stroke-width="0.7"/>
                <rect x="-10.5" y="-43.5" width="7" height="2.4" fill="#2a2a30" stroke="${INK2}" stroke-width="0.6"/>
                <rect x="3.5" y="-43.5" width="7" height="2.4" fill="#2a2a30" stroke="${INK2}" stroke-width="0.6"/>`;
      case 'zaoli':   // 皂隶帽：黑色圆筒 + 顶部小圆
        return `<rect x="-4.6" y="-48" width="9.2" height="8" rx="1.5" fill="#2a2a30" stroke="${INK2}" stroke-width="0.7"/>
                <circle cx="0" cy="-49" r="1.8" fill="#2a2a30"/>`;
      case 'doumu':   // 兜鍪：头盔 + 红缨
        return `<path d="M-5.2,-39 a5.2,5.2 0 0 1 10.4,0 Z" fill="#4a4a52" stroke="${INK2}" stroke-width="0.8"/>
                <line x1="0" y1="-44" x2="0" y2="-48.5" stroke="${INK2}" stroke-width="1.2"/>
                <circle cx="0" cy="-49.4" r="2" fill="#a03020"/>`;
      case 'ruanjin': // 软巾：横布带 + 脑后两片垂布
        return `<rect x="-5" y="-45.4" width="10" height="2.6" rx="1" fill="#3a3a3a" stroke="${INK2}" stroke-width="0.6"/>
                <path d="M-4.6,-43 q-2.4,4 -1.2,7" fill="none" stroke="#3a3a3a" stroke-width="2.2"/>`;
      case 'futou':   // 幞头
        return `<rect x="-5" y="-45.6" width="10" height="3.4" rx="1.4" fill="#2f2f38" stroke="${INK2}" stroke-width="0.6"/>
                <rect x="4" y="-45" width="4.4" height="2.4" rx="1" fill="#2f2f38"/>`;
      case 'douli':   // 斗笠
        return `<ellipse cx="0" cy="-43.6" rx="8.2" ry="2.6" fill="#c8a860" stroke="${INK}" stroke-width="0.8"/>
                <path d="M0,-46.6 L0,-43.6" stroke="${INK}" stroke-width="0.8"/>`;
      case 'toujin':  // 头巾
        return `<path d="M-5,-44.6 q5,-3.6 10,0 l0,2.2 l-10,0 Z" fill="#3a2a1a" stroke="${INK2}" stroke-width="0.6"/>`;
      default: return '';
    }
  }

  // 一个演员的 <g>：剪影四肢 + 白点眼（火柴人战争风）+ 古装彩袍（区分身份）；面朝右；脚底 (0,0)；总高 46
  const ACTOR_SCALE = 1.7;   // 骨架 48 单位 → 最近排约 78 单位（画面高 9%），拉远视角后人物整体更小

  function actorSVG(a) {
    const R = ROLE[a.role] || ROLE.commoner;
    const sc = scaleOf(a.d) * (a.scale || 1) * ACTOR_SCALE;
    const p = proj(a.wx, a.d);
    const ink = INK, ink2 = INK2;
    const robe = R.robe, sash = R.sash || '#8a4a3a';
    const L = [];
    // 剪影四肢色：默认同袍身墨线；兵丁/皂隶略深，近排默认都是深墨剪影
    const limb = '#2f2a22';

    // ---------- 腿（绕髋 0,-22 旋转）----------
    const leg = (side) => {
      const hx = side * 2.2;
      let s = `<path d="M${hx},${SK.hip} L${hx},${SK.knee} L${hx},${SK.ankle}" stroke="${limb}" stroke-width="${LW.thigh}" stroke-linecap="round" fill="none"/>`;
      s += `<circle cx="${hx}" cy="${SK.knee}" r="${LW.joint}" fill="${limb}"/>`;
      // 脚（锥形向前，火柴人战争式，脚跟在后）
      s += `<path d="M${hx},${SK.ankle} L${hx + 3},0 L${hx - 0.6},0 Z" fill="${limb}"/>`;
      if (R.rolled) s += `<path d="M${hx},${SK.ankle} L${hx},${SK.knee + 3}" stroke="#e8c4a0" stroke-width="${LW.shin}" stroke-linecap="round"/>`;
      if (R.tattered) s += `<path d="M${hx - 3},${SK.hip - 6} l6,0 l0,7 l-6,0 Z" fill="${robe}" opacity="0.9"/>`;
      return s;
    };
    // ---------- 臂（绕肩 0,-34 旋转）----------
    const arm = (side) => {
      const sx = side * 3.4;
      let s = `<path d="M${sx},${SK.shoulder} L${sx},${SK.elbow} L${sx},${SK.wrist}" stroke="${limb}" stroke-width="${LW.upper}" stroke-linecap="round" fill="none"/>`;
      // 前臂加粗成剪影（火柴人战争锥形小臂）；不画肘/腕关节圆点
      s += `<path d="M${sx},${SK.elbow} L${sx},${SK.wrist}" stroke="${limb}" stroke-width="${LW.fore + 1.2}" stroke-linecap="round" fill="none"/>`;
      if (R.rolled) s += `<path d="M${sx},${SK.wrist} L${sx},${SK.elbow + 1}" stroke="#e8c4a0" stroke-width="${LW.fore}" stroke-linecap="round"/>`;
      return s;
    };

    // ---------- 躯干 ----------
    let torso = `<path d="M0,${SK.hip} L0,${SK.shoulder}" stroke="${limb}" stroke-width="${LW.torso}" stroke-linecap="round" fill="none"/>`;
    // 袍身
    torso += `<path d="M-4.6,${SK.shoulder - 3} L4.6,${SK.shoulder - 3} L5.6,${SK.hip + 6} L-5.6,${SK.hip + 6} Z" fill="${robe}" stroke="${ink2}" stroke-width="0.7"/>`;
    if (R.tattered) {
      torso += `<path d="M-5.6,${SK.hip + 6} l2.8,4 l2.8,-4 l2.8,4 l2.8,-4" fill="none" stroke="${ink2}" stroke-width="0.8"/>`;
    }
    // 革带
    torso += `<line x1="-5.4" y1="${SK.waist}" x2="5.4" y2="${SK.waist}" stroke="${sash}" stroke-width="2"/>`;
    // 胸前补子（官员）
    if (R.buzi) torso += `<rect x="-3" y="${SK.shoulder + 5}" width="6" height="7" fill="none" stroke="#a03020" stroke-width="0.9"/>`;
    // 甲片网格（兵丁）
    if (R.armor) {
      for (let i = 0; i < 4; i++) torso += `<line x1="-4.6" y1="${SK.shoulder + 2 + i * 3}" x2="4.6" y2="${SK.shoulder + 2 + i * 3}" stroke="${ink2}" stroke-width="0.6" opacity="0.8"/>`;
      for (let i = 0; i < 3; i++) torso += `<line x1="${-3.2 + i * 3.2}" y1="${SK.shoulder + 2}" x2="${-3.2 + i * 3.2}" y2="${SK.shoulder + 14}" stroke="${ink2}" stroke-width="0.6" opacity="0.8"/>`;
    }
    // 头（剪影实心圆 + 白点眼）：火柴人战争式
    let face = '';
    const headBase = `<circle cx="0" cy="${SK.head}" r="${SK.headR}" fill="${limb}"/>`;
    if (R.mask) {
      face = `<rect x="-4.4" y="-40.4" width="8.8" height="2.6" fill="#3a2a1a"/>`;
    } else {
      const eyeR = 0.75;
      const eyeY = SK.head - 0.6;
      const eyeDx = 1.9;
      const eyeL = `<circle cx="${-eyeDx}" cy="${eyeY}" r="${eyeR}" fill="#ffffff"/>`;
      const eyeRc = `<circle cx="${eyeDx}" cy="${eyeY}" r="${eyeR}" fill="#ffffff"/>`;
      let mouth = '';
      if (a.mood === 'happy') mouth = `<path d="M-2,-37 Q0,-35.4 2,-37" fill="none" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round"/>`;
      else if (a.mood === 'sad') mouth = `<path d="M-2,-36.2 Q0,-37.8 2,-36.2" fill="none" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round"/>`;
      face = eyeL + eyeRc + mouth;
    }

    // ---------- 道具 ----------
    let tool = '';
    if (R.tool === 'staff') tool = `<line x1="6" y1="-38" x2="6" y2="2" stroke="#8a4a3a" stroke-width="2.2"/><line x1="6" y1="-38" x2="6" y2="-18" stroke="#2a2a30" stroke-width="2.2"/>`;
    if (R.tool === 'spear') tool = `<line x1="7" y1="-46" x2="7" y2="4" stroke="#5a3a1a" stroke-width="1.8"/><path d="M7,-50 l-2,5 l4,0 Z" fill="#a03020"/>`;
    if (R.tool === 'saber') tool = `<path d="M7,-24 q6,-8 10,-14" fill="none" stroke="#8a9aa8" stroke-width="2.2" stroke-linecap="round"/><line x1="7" y1="-24" x2="6" y2="-20" stroke="#3a2a1a" stroke-width="1.6"/>`;
    if (R.tool === 'fan') tool = `<path d="M9,-30 q4,-3 7,0 q-3,3 -7,0 Z" fill="#e8d8b0" stroke="${ink}" stroke-width="0.7"/>`;
    if (R.tool === 'stick') tool = `<line x1="6" y1="-30" x2="6" y2="0" stroke="#8a6a3a" stroke-width="1.6"/>`;
    if (R.tool === 'carry') tool = `<line x1="-11" y1="-38" x2="13" y2="-36" stroke="#8a6a3a" stroke-width="1.6"/><path d="M12,-36 q3,4 0,8 l-6,0 q-3,-4 0,-8 Z" fill="#c8a860" stroke="${ink}" stroke-width="0.7"/>`;
    if (R.tool === 'vegLoad') tool = `<line x1="-11" y1="-38" x2="13" y2="-36" stroke="#8a6a3a" stroke-width="1.6"/>
      <path d="M13,-36 q4,3 1,8 l-7,0 q-2,-4 1,-8 Z" fill="#7a9a5a" stroke="${ink}" stroke-width="0.7"/>
      <path d="M15,-33 l2,-2 M16,-31 l2.5,-1 M14.5,-35 l1.5,-2.5" stroke="#5a7a3a" stroke-width="0.8" fill="none"/>
      <path d="M-11,-36 q-4,3 -1,8 l7,0 q2,-4 -1,-8 Z" fill="#7a9a5a" stroke="${ink}" stroke-width="0.7"/>`;
    if (R.tool === 'hoe') tool = `<line x1="7" y1="-34" x2="7" y2="2" stroke="#8a6a3a" stroke-width="1.6"/><path d="M7,2 l-5,2 l1,2 l5,-2 Z" fill="#6a6a70" stroke="${ink}" stroke-width="0.6"/>`;
    if (R.tool === 'knife') tool = `<path d="M6,-20 l7,-3 l1,2 l-7,3 Z" fill="#b0b0b8" stroke="${ink}" stroke-width="0.6"/>`;
    if (R.tool === 'bowl') tool = `<ellipse cx="8" cy="-2" rx="4" ry="2" fill="none" stroke="${ink}" stroke-width="0.9"/>`;

    const head = `${headBase}${face}${hatOf(R.hat)}`;

    const body = `<g class="torso">${torso}</g>
      <g class="arm-l">${arm(-1)}</g><g class="arm-r">${arm(1)}</g>
      <g class="leg-l">${leg(-1)}</g><g class="leg-r">${leg(1)}</g>
      <g class="head">${head}</g>${tool}`;

    return `<g class="actor" data-aid="${a.aid}"><g class="a-body" transform="translate(${p.x.toFixed(1)},${p.y.toFixed(1)}) scale(${(sc * a.dir).toFixed(3)},${sc.toFixed(3)})">${body}</g></g>`;
  }

  // ==================== 背景层（天空/远景/地面基座 + 街市纹理） ====================

  function renderSceneBG(gs, ctx) {
    const v = gs.values;
    const sc = scN(gs.month);
    const L = [[], [], [], []];           // 0 天空 1 (空置) 2 地面肌理 3 特效
    const parts = (i, s) => L[i].push(s);
    const p = (n) => n.toFixed(1);

    // ---- 天空 ----
    parts(0, `<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${sc.skyTop}"/><stop offset="100%" stop-color="${sc.skyBot}"/></linearGradient></defs>`);
    parts(0, `<rect x="0" y="0" width="${W}" height="${HORIZON}" fill="url(#sky)"/>`);
    // ---- 远山（固定淡青灰，不随季节变暖）----
    parts(0, `<path d="M0,${HORIZON - 120} Q70,${HORIZON - 205} 150,${HORIZON - 130} Q225,${HORIZON - 225} 300,${HORIZON - 135} Q380,${HORIZON - 200} 440,${HORIZON - 125} L440,${HORIZON} L0,${HORIZON} Z" fill="${MIST}" opacity="0.85"/>`);
    parts(0, `<path d="M0,${HORIZON - 62} Q110,${HORIZON - 140} 230,${HORIZON - 72} Q340,${HORIZON - 145} 440,${HORIZON - 80} L440,${HORIZON} L0,${HORIZON} Z" fill="${MIST}" opacity="0.55"/>`);
    // ---- 勾线云 ----
    parts(0, `<g class="cloud-drift">${cloudJie(80, 92, 1, 0.8)}${cloudJie(250, 150, 0.75, 0.6)}${cloudJie(370, 66, 0.9, 0.7)}</g>`);
    // ---- 地面 ----
    parts(0, `<rect x="0" y="${HORIZON}" width="${W}" height="${H - HORIZON}" fill="${sc.ground}"/>`);

    // ---- 派生指标（沿用原有数值驱动逻辑）----
    const prosperity = clamp((v.population + v.people + v.tresury) / 300, 0, 1);
    const famine = clamp((40 - v.granary) / 40, 0, 1);
    const unrest = clamp((45 - v.security) / 45, 0, 1);
    const rep = clamp(v.reputation / 100, 0, 1);
    const warLike = (ctx.lastEventTitle || '').match(/战|兵|匪|乱|寇|攻/) ? 1 : 0;
    const weatherBad = (ctx.lastEventTitle || '').match(/雨|涝|旱|蝗|疫/) ? 1 : 0;

    // ---- 麻雀（第三批）：天空气层，CSS 飞掠，繁荣度越高越热闹 ----
    const birdN = prosperity > 0.55 ? 3 : 1;
    for (let i = 0; i < birdN; i++) {
      parts(0, sparrowJie(50 + rnd(i * 7 + 1) * 340, 60 + rnd(i * 11 + 2) * 90, i * 1.3 + 2.2));
    }

    // ---- 街市底纹：斜向车辙/横纹 ----
    for (let i = 0; i < 16; i++) {
      const d0 = 20 + i * 32, p0 = proj(-440, d0), p1 = proj(440, d0);
      parts(2, `<line x1="${p(p0.x)}" y1="${p(p0.y)}" x2="${p(p1.x)}" y2="${p(p1.y)}" stroke="${INK}" stroke-width="0.7" opacity="0.20"/>`);
    }
    // 街市两侧的屋基线（把街道"托"出来）
    [0, 1].forEach(function (side) {
      const d0 = 10, d1 = 480;
      const a0 = proj(side ? 185 : -185, d0), a1 = proj(side ? 185 : -185, d1);
      parts(2, `<line x1="${p(a0.x)}" y1="${p(a0.y)}" x2="${p(a1.x)}" y2="${p(a1.y)}" stroke="${INK}" stroke-width="1" opacity="0.28"/>`);
    });

    // ---- 灾年阴云 ----
    if (weatherBad) parts(3, `<rect x="0" y="0" width="${W}" height="${HORIZON}" fill="#5c6b73" opacity="0.18"/>`);
    // ---- 战火烟 ----
    if (warLike) {
      const fp = proj(60, 170);
      parts(3, `<g class="fx-flicker">${fire(fp.x, fp.y - 30, 0.8)}</g>`);
      parts(3, `<g class="fx-rise">${smoke(fp.x + 10, fp.y - 60, 0.9)}</g>`);
    }
    // ---- 前景：地面肌理 + 散落道具 ----
    parts(2, `<path d="M0,${H - 40} Q110,${H - 52} 220,${H - 40} Q330,${H - 30} 440,${H - 44}" fill="none" stroke="${INK}" stroke-width="0.8" opacity="0.16"/>`);
    for (let i = 0; i < 7; i++) {
      const gx = 20 + rnd(i * 17 + 9) * (W - 40), gy = H - 26 - rnd(i * 23 + 4) * 34;
      parts(2, `<ellipse cx="${p(gx)}" cy="${p(gy)}" rx="${(2 + rnd(i * 3) * 3).toFixed(1)}" ry="1.1" fill="${INK}" opacity="0.13"/>`);
    }

    const layers = L.map((items, i) => items.length ? `<g class="sc-layer sc-l${i}">${items.join('')}</g>` : '').join('');
    return `<svg class="scene-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">${layers}</svg>`;
  }

  // ==================== 人物层（含全部前景物，统一按深度排序 = 清明上河图式遮挡） ====================

  const TIERS = [
    { d: 30,   cnt: 2, jit: 0.08 },   // 最近（紧贴观者）
    { d: 150,  cnt: 3, jit: 0.08 },
    { d: 275,  cnt: 3, jit: 0.07 },
    { d: 400,  cnt: 4, jit: 0.06 },
    { d: 525,  cnt: 4, jit: 0.05 },
    { d: 645,  cnt: 5, jit: 0.05 },   // 最远（剪影，天际线附近）
  ];
  const MOVE_ROLES = ['commoner', 'commoner', 'commoner', 'peddler', 'farmer', 'child'];

  // 前景区物品（与人物同层，按脚底深度一起排序）。d = 脚底世界纵深，脚底越远越早画。
  function buildFgItems(gs, ctx) {
    const v = gs.values;
    const sc = scN(gs.month);
    const prosperity = clamp((v.population + v.people + v.tresury) / 300, 0, 1);
    const famine = clamp((40 - v.granary) / 40, 0, 1);
    const unrest = clamp((45 - v.security) / 45, 0, 1);
    const rep = clamp(v.reputation / 100, 0, 1);
    const warLike = (ctx.lastEventTitle || '').match(/战|兵|匪|乱|寇|攻/) ? 1 : 0;
    const items = [];

    // ---- 城墙（最远排之后，d=520）----
    items.push({ d: 520, t: 0, s: `<g transform="translate(0,${proj(0, 520).y.toFixed(1)})">${cityWallJie(proj(-120, 520).x, 190, unrest > 0.6, scaleOf(520))}</g>` });

    // ---- 民居（数量 ∝ 发展度；样式随繁荣度升级：茅草房 → 瓦房 → 商铺/双层楼）----
    const flags = (gs.flags && gs.flags.has) ? gs.flags : null;
    const hasWharf = flags ? flags.has('canal_wharf') : false;
    const nHouses = 20 + Math.round(prosperity * 16);   // 20~36 栋，铺满整屏地面（随繁荣度增长）
    // 界画风格户型表：随繁荣度演进，但每档都混多种样式，开局即见茅草/断壁
    // 开局三值约 150/300≈0.5 → 落「茅草断壁」档；发展后过渡到瓦房，再出商铺/双层楼
    // 0.80+ 顶部档加入酒馆（tavern）：商业繁华的标志性建筑
    const housePool = prosperity < 0.55
      ? ['thatch', 'thatch', 'ruin', 'thatch', 'ok', 'ok']
      : prosperity < 0.8
        ? ['ok', 'ok', 'thatch', 'ok', 'shop', 'ok']
        : prosperity < 0.92
          ? ['ok', 'shop', 'ok', 'two', 'shop', 'two']
          : ['ok', 'shop', 'tavern', 'two', 'shop', 'two'];
    // 沿横向道路两侧随机铺开：四段纵深均分（前中后都铺），横向铺满整个可视区、错落有致。
    // 关键修正：wx 直接撒在「可视世界横轴范围」内并夹住，保证房子铺满画面、
    // 不再贴边挤成一簇或大量跑出屏幕；新增「天际线远景带」填满视平线下的空地，
    // 让上方、两侧、下方都不再大片留白。
    const bands = [
      { lo: 20,  hi: 170, frac: 0.25 },   // 近景：前景大屋（最靠近观者）
      { lo: 170, hi: 330, frac: 0.25 },   // 中近景
      { lo: 330, hi: 500, frac: 0.25 },   // 中远景
      { lo: 505, hi: 720, frac: 0.25 },   // 远景天际线带：贴视平线的远方民居
    ];
    const assigned = bands.map(b => Math.max(1, Math.round(nHouses * b.frac)));
    assigned[assigned.length - 1] += nHouses - assigned.reduce((a, b) => a + b, 0);
    let hi = 0;
    const placed = [];   // 已放置房屋的 (d, wx)，用于最小间距防重叠（同帧内确定性去重）
    bands.forEach(function (band, bi) {
      for (let j = 0; j < assigned[bi]; j++) {
        const i = hi++;
        // 纵深也加确定性抖动（±20 世界单位），避免两栋房落在几乎同一 (d, wx) 上挤成团
        let d = band.lo + rnd(i * 13 + 2) * (band.hi - band.lo) + (rnd(i * 31 + 7) - 0.5) * 40;
        d = Math.max(band.lo, Math.min(band.hi, d));
        const scale = scaleOf(d);
        const w = 52 * scale;
        const hw = w / 2;
        // 可视世界横轴范围（扣除半宽+边距，保证整栋在屏内，不再大量跑出屏幕）
        const wxMin = -220 + 0.42 * d + hw + 6;
        const wxMax =  220 + 0.42 * d - hw - 6;
        // 横向街道空当：屏幕中心街对应世界横轴的斜线 wx=0.42d，两侧各留 lane 宽
        const streetWx = 0.42 * d;
        const lane = 34 + d * 0.06;                 // 街半宽随纵深略收窄（透视）
        const leftW = (streetWx - lane) - wxMin;    // 街左侧可放范围
        const rightW = wxMax - (streetWx + lane);   // 街右侧可放范围
        // 防重叠：候选横坐标用「确定性打乱的均匀网格」铺满街道两侧整条可放宽度，
        // 每个格点同时评估「街左」和「街右」两个位置，取与已放房屋屏幕间距最大的那个；
        // 第一个 ≥ MIN_SEP 的即用。这样哪一侧空就往哪一侧放，远景多栋也不会挤成一簇。
        const MIN_SEP = 34;
        const GRID_N = 40;
        const gord = [];                       // 确定性打乱后的网格序
        for (let g = 0; g < GRID_N; g++) gord.push(g);
        for (let g = GRID_N - 1; g > 0; g--) {
          const r = Math.floor(rnd(i * 97 + g * 13 + 3) * (g + 1));
          const t = gord[g]; gord[g] = gord[r]; gord[r] = t;
        }
        const cands = [];                      // 每个格点产生左右两个候选（哪侧可放就加哪侧）
        for (let k = 0; k < GRID_N; k++) {
          const u = (gord[k] + rnd(i * 17 + k * 7 + 1) * 0.8) / GRID_N;   // 网格点 + 格内抖动
          if (leftW > 8) cands.push(wxMin + u * leftW);                  // 街左候选
          if (rightW > 8) cands.push((streetWx + lane) + u * rightW);    // 街右候选
        }
        if (!cands.length) cands.push(wxMin + rnd(i * 11 + 5) * (wxMax - wxMin));   // 极端窄兜底
        let bestWx = null, bestSep = -1, pick = null;
        for (let k = 0; k < cands.length; k++) {
          const cpt = proj(cands[k], d);
          let sep = Infinity;
          for (let q = 0; q < placed.length; q++) {
            const s = Math.hypot(cpt.x - placed[q].x, cpt.y - placed[q].y);
            if (s < sep) sep = s;
          }
          if (sep > bestSep) { bestSep = sep; bestWx = cands[k]; }
          if (sep >= MIN_SEP) { pick = cands[k]; break; }   // 第一个达标即用，够稀疏
        }
        const wx = (pick != null) ? pick : bestWx;
        placed.push({ wx: wx, d: d, x: proj(wx, d).x, y: proj(wx, d).y });
        const pt = proj(wx, d);
        let hs = 'ok';
        if (warLike && i % 2 === 0) hs = 'burning';
        else if (unrest > 0.62 && i % 2 === 1) hs = 'broken';
        else if (famine > 0.6 && i % 3 === 2) hs = 'broken';
        const kind = housePool[i % housePool.length];
        const depth = 30 * scale;
        let houseSvg = '';
        if (kind === 'thatch') {
          houseSvg = thatchJie(pt.x, pt.y, w, { state: hs === 'ok' ? 'ok' : hs });
        } else if (kind === 'ruin') {
          houseSvg = ruinJie(pt.x, pt.y, w, scale);
        } else if (kind === 'shop') {
          houseSvg = shopJie(pt.x, pt.y, w, { state: hs });
        } else if (kind === 'tavern') {
          houseSvg = tavernJie(pt.x, pt.y, w, { state: hs });
        } else if (kind === 'two') {
          houseSvg = twoStoryJie(pt.x, pt.y, w, { state: hs });
        } else {
          houseSvg = houseJie(pt.x, pt.y, w, { state: hs, depth });
        }
        items.push({ d, t: 1, s: houseSvg, hk: kind });   // hk=户型标记（供数量/种类验证，不参与渲染）
        // 第三批·炊烟：从屋脊升起，最多 4 条，负 delay 错开；破败/着火/断壁不出烟
        if (i < 4 && kind !== 'ruin' && hs === 'ok') {
          items.push({ d, t: 1, s: chimneySmokeJie(pt.x, pt.y - w * 0.9, (i * 2.3) % 3) });
        }
        if (rnd(i * 13 + 3) > 0.45) {
          const ts = wx < streetWx ? 1 : -1;   // 树长在房子朝向街道的那一侧
          const tp = proj(wx + ts * (30 + rnd(i * 3 + 1) * 40), d + 6);
          items.push({ d: d + 6, t: 1, s: treeJie(tp.x, tp.y, 0.62 * scale, sc.tree, hs === 'broken') });
        }
      }
    });

    // ---- 运河 + 码头（西河修浚后永久出现，繁荣的地标）----
    if (hasWharf) {
      const ca0 = proj(-150, 120), ca1 = proj(-52, 470);
      items.push({ d: 470, t: 0, s: canalJie(ca0.x, ca0.y, ca1.x, ca1.y, 34, 14) });
      const wp = proj(-152, 132);
      items.push({ d: 132, t: 1, s: wharfJie(wp.x, wp.y, 0.9, true) });
      // 第二批·行船：船作为前景物进入深度排序（与人物同层遮挡），驱动数据由 buildBoats 另路提供
      const boats = buildBoats(gs, ctx);
      boats.items.forEach(function (b) { items.push(b); });
    }

    // ---- 第三批·地面活物：鸡 + 车（与人物同层，按深度遮挡）----
    const ground = buildGround(gs, ctx);
    ground.items.forEach(function (it) { items.push(it); });

    // ---- 县衙（气派 ∝ 官声）----
    const yp = proj(200, 90);
    items.push({ d: 90, t: 1, s: yamenJie(yp.x, yp.y, 88 * scaleOf(90), rep) });

    // ---- 廒仓（饱满度 ∝ 粮仓）----
    const gran = clamp((v.granary - 10) / 80, 0, 1);
    const gp = proj(-215, 86);
    items.push({ d: 86, t: 1, s: granaryJie(gp.x, gp.y, 52 * scaleOf(86), gran) });

    return items;
  }

  function buildActors(gs, ctx) {
    const v = gs.values;
    const prosperity = clamp((v.population + v.people + v.tresury) / 300, 0, 1);
    const famine = clamp((40 - v.granary) / 40, 0, 1);
    const unrest = clamp((45 - v.security) / 45, 0, 1);
    const happy = clamp((v.people - 40) / 60, 0, 1);
    const sad = clamp((40 - v.people) / 40, 0, 1);
    const mood = happy > 0.5 ? 'happy' : sad > 0.3 ? 'sad' : unrest > 0.5 ? 'angry' : 'normal';

    // 总人数 ∝ 繁华度
    let total = Math.round(10 + prosperity * 11);   // 10..21
    const counts = TIERS.map(t => t.cnt);
    let over = counts.reduce((a, b) => a + b, 0) - total;
    for (let i = counts.length - 1; i >= 0 && over > 0; i--) {
      const take = Math.min(counts[i], over);
      counts[i] -= take; over -= take;
    }

    const out = [];
    let n = 0;
    TIERS.forEach(function (t, ti) {
      const nHere = counts[ti];
      if (nHere <= 0) return;
      const seg = 2 * 380 / Math.max(1, nHere);   // 出画穿越：世界横范围 ±380
      for (let i = 0; i < nHere; i++) {
        // 不等距 + 每排留一处空档
        let wx = -370 + seg * i + (rnd(n * 19 + 3) - 0.5) * seg * 0.75;
        if (i === Math.floor(nHere / 2)) wx += 26;   // 空档
        wx = Math.max(-370, Math.min(370, wx));       // 硬约束：人物 wx 只落街面世界域，不越界
        // 朝向：60~75% 朝同一侧（人流主调）
        const goRight = rnd(n * 31 + 7) < 0.68;
        const dir = goRight ? 1 : -1;
        // 角色分配
        let role = MOVE_ROLES[n % MOVE_ROLES.length];
        if (n === 2) role = 'official';                                  // 知县固定出镜
        else if (v.security > 60 && n % 7 === 4) role = 'soldier';
        else if (v.security > 55 && n % 11 === 6) role = 'patrol';       // 治安好 → 官兵巡逻（蓝袍佩刀）
        else if (prosperity > 0.7 && (n % 9 === 2 || n % 9 === 5)) role = 'stroller';  // 繁荣 → 闲人游玩（慢走摇扇）
        else if (prosperity > 0.45 && n % 8 === 5) role = 'vegFarmer';   // 有产出 → 农夫挑菜进城
        else if (unrest > 0.55 && n % 6 === 3) role = 'bandit';
        else if (famine > 0.35 && n % 5 === 2) role = 'refugee';
        else if (famine > 0.6 && n % 9 === 5) role = 'beggar';
        const R = ROLE[role] || ROLE.commoner;
        const walk = R.walk || { sp: 7, fq: 1.2, leg: 20, arm: 12, bob: 1 };
        const state = (role === 'official') ? 'walk' : (walk.sp > 0 ? 'walk' : 'idle');
        // 苏醒时刻（秒，从月结开场算）：近排先醒，同排内从右往左错开 0~0.4s
        // 未到时刻的演员由 scene_animator 冻结在原位（原地解冻，不从画外走入）
        const wake = (ti <= 2 ? 1.10 : 1.70) + (380 - wx) / 760 * 0.4;
        out.push({
          aid: 'r' + ti + '-' + i, role: role, tier: ti, d: t.d,
          wx: wx, state: state, dir: dir,
          speed: walk.sp * 6,           // 单位/秒（步幅×步频的近似）
          freq: walk.fq, phase: rnd(n * 41 + 11),
          legAmp: walk.leg, armAmp: walk.arm, bob: walk.bob,
          scale: 1 + (rnd(n * 53 + 13) - 0.5) * t.jit * 2,
          mood: role === 'official' ? 'normal' : mood,
          wxMin: -330, wxMax: 330,
          silence: ti >= 5,            // 最远两排：剪影
          wake: wake,                   // 苏醒时刻（秒）
        });
        n++;
      }
    });
    return out;
  }

  function renderSceneFG(actors, gs, ctx) {
    const fgItems = buildFgItems(gs, ctx);
    const pool = [];
    // 人物：按脚底 (wx, d) 世界坐标参与排序；房屋/树以自身 (wx, d) 参与排序。
    // d 越大（越远）越先画，近的盖在远的上面 → 人从房前/房后走过，遮挡正确。
    actors.forEach(function (a) {
      pool.push({ d: a.d, t: 2, s: actorSVG(a) });
    });
    fgItems.forEach(function (it) {
      pool.push({ d: it.d, t: it.t, s: it.s });
    });
    pool.sort(function (x, y) {
      if (y.d !== x.d) return y.d - x.d;   // 远(d大)在前
      return y.t - x.t;                    // 同深度：人物(2)在建筑(1)之后、城墙(0)之后 → 人盖在房上（在房前）
    });
    return `<svg id="scene-fg" class="scene-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">${pool.map(function (o) { return o.s; }).join('')}</svg>`;
  }

  // 一次刷新：背景全量重绘 + 人物/前景物 diff + 挂动画
  function refreshScene(gs, ctx) {
    // 每局摇一次种子（由上层 state.sceneSeed 传入），同局内每月重绘沿用同一种子不跳变
    SCENE_SEED = (ctx && typeof ctx.seed === 'number') ? ctx.seed : (Math.random() * 100000);
    const bg = document.getElementById('scene-bg');
    const fg = document.getElementById('scene-fg');
    if (bg) bg.innerHTML = renderSceneBG(gs, ctx).replace(/^<svg[^>]*>|<\/svg>$/g, '');
    const list = buildActors(gs, ctx);
    if (fg) fg.innerHTML = renderSceneFG(list, gs, ctx).replace(/^<svg[^>]*>|<\/svg>$/g, '');
    if (global.SceneAnimator) {
      global.SceneAnimator.mount(list);
      global.SceneAnimator.mountBoats(buildBoats(gs, ctx).anim);      // 第二批·行船驱动数据
      global.SceneAnimator.mountGround(buildGround(gs, ctx).anim);    // 第三批·地面活物驱动数据
    }
    return true;
  }

  function renderIntroScene(bg) {
    const INK = '#3a3226';
    const L = [[], [], [], []];
    const parts = (i, s) => L[i].push(s);
    const p = (n) => (Math.round(n * 10) / 10).toFixed(1);

    // —— 淡墨远山（多层高斯模糊晕染） ——
    function ridge(d, o) { return `<path d="${d}" fill="${INK}" opacity="${o}" filter="url(#inkwash)"/>`; }
    function mist(y, rx, o) { return `<ellipse cx="220" cy="${y}" rx="${rx}" ry="24" fill="${INK}" opacity="${o}" filter="url(#inkwash)"/>`; }
    // —— 点叶树 ——
    function inkTree(x, y, s, o) {
      o = o == null ? 0.9 : o;
      let dot = '';
      for (let i = 0; i < 7; i++) {
        const a = (i / 7) * Math.PI * 2;
        const rr = s * (6 + (i % 3) * 2.5);
        dot += `<circle cx="${(x + Math.cos(a) * rr).toFixed(1)}" cy="${(y - s * 26 + Math.sin(a) * rr).toFixed(1)}" r="${(s * (3 + (i % 2))).toFixed(1)}" fill="${INK}" opacity="${(o * 0.72).toFixed(2)}"/>`;
      }
      return `<g opacity="${o}"><line x1="${x}" y1="${y}" x2="${x}" y2="${y - s * 34}" stroke="${INK}" stroke-width="${(s * 1.6).toFixed(1)}"/><line x1="${x}" y1="${y - s * 18}" x2="${x - s * 12}" y2="${y - s * 30}" stroke="${INK}" stroke-width="${(s * 1.1).toFixed(1)}"/><line x1="${x}" y1="${y - s * 22}" x2="${x + s * 11}" y2="${y - s * 32}" stroke="${INK}" stroke-width="${(s * 1).toFixed(1)}"/>${dot}</g>`;
    }
    // —— 枯树（枯笔，战后） ——
    function deadTree(x, y, s, o) {
      o = o == null ? 0.85 : o;
      const t = (n) => (n * s).toFixed(1);
      let twig = '';
      [[-0.45, -0.5], [-0.1, -0.7], [0.3, -0.55], [0.55, -0.38], [-0.65, -0.3]].forEach(function (d) {
        twig += `<path d="M${x},${y - s * 30} q${t(d[0] * 30)},${t(d[1] * -16)} ${t(d[0] * 54)},${t(d[1] * -34)}" stroke="${INK}" stroke-width="${t(0.9)}" fill="none"/>`;
      });
      return `<g opacity="${o}" stroke-linecap="round" fill="none" stroke="${INK}"><path d="M${x},${y} q${t(-4)},${t(-18)} ${t(-2)},${t(-40)} q${t(1)},${t(-14)} ${t(6)},${t(-20)}" stroke-width="${t(2.4)}"/>${twig}</g>`;
    }
    // —— 水墨人影（墨块剪影，不画五官，留白） ——
    function inkFigure(x, y, s, hunch) {
      const h = s * 34;
      const bend = hunch ? ` q${p(-s * 6)},${p(h * 0.5)} ${p(-s * 2)},${p(h)}` : ` q${p(s * 1)},${p(h * 0.5)} ${p(s * 0)},${p(h)}`;
      return `<g stroke="${INK}" stroke-width="${(s * 1.3).toFixed(1)}" stroke-linecap="round" fill="none">
        <circle cx="${x}" cy="${y - h - s * 4}" r="${s * 4}" fill="${INK}" stroke="none"/>
        <path d="M${x},${y - h}${bend}" opacity="0.9"/>
        <path d="M${x},${y - h * 0.55} l${p(-s * 9)},${p(s * 8)}" opacity="0.7"/>
        <path d="M${x},${y - h * 0.55} l${p(s * 9)},${p(s * 8)}" opacity="0.7"/>
      </g>`;
    }
    // —— 墨瓦屋顶 / 简笔民居 ——
    function inkRoof(x, y, w, peakH) {
      return `<path d="M${p(x - w * 0.62)},${y} L${x},${p(y - peakH)} L${p(x + w * 0.62)},${y}" fill="${INK}" opacity="0.82"/>`;
    }
    function inkHouse(x, y, w, h, wallO) {

    last = (typeof performance !== 'undefined' ? performance.now() : Date.now());
    rafId = requestAnimationFrame(tick);
  }

  function stop() {
    if (!running) return;
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = 0;
  }

  /**
   * settle() —— 打断苏醒开场，让全部演员立刻进入稳态
   * 供 skipRecap() 调用：玩家点跳过时画面"现在什么样就定格成什么样"，不要继续演
   */
  function settle() {
    t = 1e6; settled = true;
    for (var i = 0; i < actors.length; i++) actors[i].a.wake = 0;
    // 立刻写一帧稳态姿态，避免在 stop() 之前留下半帧冻结态
    for (var j = 0; j < actors.length; j++) step(actors[j], 0);
  }

  function tick(now) {
    if (!running) return;
    // 卡帧时把 dt 钳到 50ms：不钳的话切回标签页时人物会瞬移到边界
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    t += dt;                                   // 苏醒计时
    for (var i = 0; i < actors.length; i++) step(actors[i], dt);
    for (var j = 0; j < boats.length; j++) stepBoat(boats[j], dt);
    for (var k = 0; k < grounds.length; k++) stepGround(grounds[k], dt);
    rafId = requestAnimationFrame(tick);
  }

  /**
   * stepBoat(o, dt) —— 第二批·行船：
   *   船体沿河道 A→B 匀速往返（出端点即掉头），附带 ±1.5 正弦浮沉（艏艉起伏），
   *   船尾橹绕轴 ±18° 摇橹。仅写 2 组 transform，成本远低于人物层。
   *   b.dir 取 ±1：+1 顺河道方向（A→B），-1 逆向；掉头时船体 rotate 加 180°。
   */
  function stepBoat(o, dt) {
    var b = o.b;
    if (!o.hull) return;
    var ang = b.angDeg;                          // 河道朝向（度）
    // 沿河道归一化参数 s ∈ [0,1]，到端点反弹
    b.t += (b.dir * b.speed / b.L) * dt;
    if (b.t > 1) { b.t = 1; b.dir = -1; }
    if (b.t < 0) { b.t = 0; b.dir = 1; }
    var sx = b.x0 + (b.x1 - b.x0) * b.t;
    var sy = b.y0 + (b.y1 - b.y0) * b.t;
    var bob = Math.sin(b.phase) * 1.5;           // 浮沉 ±1.5
    b.phase += dt * 1.6;                          // 浮沉频率（慢）
    var flip = b.dir < 0 ? 180 : 0;               // 逆向时船头翻转
    o.hull.setAttribute('transform',
      'translate(' + sx.toFixed(1) + ',' + (sy + bob).toFixed(1) + ') rotate(' + (ang + flip).toFixed(1) + ') scale(' + b.scale.toFixed(3) + ')');
    // 橹：绕船尾摇 ±18°
    var oarAng = Math.sin(b.phase * 1.4) * 18;
    o.oar.setAttribute('transform', 'rotate(' + oarAng.toFixed(1) + ')');
  }

  /**
   * stepGround(o, dt) —— 第三批·地面活物：
   *   chicken：沿地面左右走动（走到端点掉头），头点地啄食 + 两腿交替。
   *   cart：匀速行进（端点掉头），车轮由 SMIL 自转，这里只推进位移。
   *   二者共用 c-body 承载位移，鸡额外写两条腿 rotate。
   */
  function stepGround(o, dt) {
    var b = o.b;
    if (!o.body) return;
    // 苏醒门：月结开场未到 1.2s 前冻结（跟人物层拉开节奏，避免一拥而上）
    if (t < 1.2) { b.phase += dt * 0.6; return; }
    b.x += b.dir * b.speed * dt;
    if (b.x > b.xMax) { b.x = b.xMax; b.dir = -1; }
    if (b.x < b.xMin) { b.x = b.xMin; b.dir = 1; }
    b.phase += dt * (b.kind === 'chicken' ? 3.2 : (b.kind === 'horse' ? 5.5 : 1.0));
    var bob = 0;
    if (b.kind === 'chicken') {
      bob = -Math.abs(Math.sin(b.phase * 0.5)) * 0.8;   // 啄食点头
      var peck = Math.sin(b.phase) * 14;                // 腿交替
      if (o.legL) o.legL.setAttribute('transform', 'rotate(' + peck.toFixed(1) + ',0,0)');
      if (o.legR) o.legR.setAttribute('transform', 'rotate(' + (-peck).toFixed(1) + ',0,0)');
    } else if (b.kind === 'horse') {
      // 马：四腿交替 + 骑者起伏（相位差 0.25，"人比马晚半拍"）
      var gallop = Math.sin(b.phase) * 22;
      if (o.legL) o.legL.setAttribute('transform', 'rotate(' + gallop.toFixed(1) + ',0,0)');
      if (o.legR) o.legR.setAttribute('transform', 'rotate(' + (-gallop).toFixed(1) + ',0,0)');
      if (o.legL2) o.legL2.setAttribute('transform', 'rotate(' + (-gallop).toFixed(1) + ',0,0)');
      if (o.legR2) o.legR2.setAttribute('transform', 'rotate(' + gallop.toFixed(1) + ',0,0)');
      bob = Math.sin(b.phase * 2) * 1.1;               // 马身起伏
      if (o.rider) o.rider.setAttribute('transform', 'translate(0,' + (Math.sin((b.phase - 0.25) * 2) * 1.1 - bob).toFixed(2) + ')');
    }
    o.body.setAttribute('transform',
      'translate(' + b.x.toFixed(1) + ',' + (b.y + bob).toFixed(1) + ') scale(' + (b.scale * b.dir).toFixed(3) + ',' + b.scale.toFixed(3) + ')');
  }

  function step(o, dt) {
    var a = o.a;
    if (!o.body) return;

    // ---- 0) 苏醒：未到时刻的演员冻结在原位（原地解冻，姿态为站立） ----
    var awake = !(t < (a.wake || 0));
    if (!awake) {
      var p0 = proj(a.wx, a.d);
      var s0 = scaleOf(a.d) * a.scale;
      o.body.setAttribute('transform',
        'translate(' + p0.x.toFixed(1) + ',' + p0.y.toFixed(1) + ') scale(' + (s0 * a.dir).toFixed(3) + ',' + s0.toFixed(3) + ')');
      o.torso.setAttribute('transform', 'translate(0,0)');
      if (o.head) o.head.setAttribute('transform', 'translate(0,0)');
      o.legL.setAttribute('transform', 'rotate(0,0,-22)');
      o.legR.setAttribute('transform', 'rotate(0,0,-22)');
      o.armL.setAttribute('transform', 'rotate(0,0,-34)');
      o.armR.setAttribute('transform', 'rotate(0,0,-34)');
      return;
    }

    // ---- 1) 位移（出画穿越：走出世界范围就折返，SVG 默认裁掉 viewBox 外内容）----
    if (a.state === 'walk' && a.speed > 0) {
      a.wx += a.dir * a.speed * dt;
      if (a.wx > a.wxMax) { a.wx = a.wxMax; a.dir = -1; }
      if (a.wx < a.wxMin) { a.wx = a.wxMin; a.dir = 1; }
      a.phase = (a.phase + a.freq * dt) % 1;
    } else {
      a.phase = (a.phase + 0.18 * dt) % 1;   // 待机：极慢的呼吸
    }

    // ---- 2) 姿态：每帧只写 8 条属性 ----
    var p = proj(a.wx, a.d);
    var sc = scaleOf(a.d) * a.scale;

    o.body.setAttribute('transform',
      'translate(' + p.x.toFixed(1) + ',' + p.y.toFixed(1) + ') scale(' + (sc * a.dir).toFixed(3) + ',' + sc.toFixed(3) + ')');

    var sw  = Math.sin(a.phase * Math.PI * 2);            // -1..1 腿步态摆动
    var swA = Math.sin((a.phase - 0.08) * Math.PI * 2);   // 手臂略滞后于腿，摆幅收一点更自然
    var bob = -Math.abs(Math.cos(a.phase * Math.PI * 2)) * (a.bob || 1);

    o.torso.setAttribute('transform', 'translate(0,' + bob.toFixed(2) + ')');
    if (o.head)  o.head.setAttribute('transform', 'translate(0,' + (bob * 0.55).toFixed(2) + ')');
    o.legL.setAttribute('transform', 'rotate(' + (-sw * a.legAmp).toFixed(1) + ',0,-22)');
    o.legR.setAttribute('transform', 'rotate(' + ( sw * a.legAmp).toFixed(1) + ',0,-22)');
    o.armL.setAttribute('transform', 'rotate(' + ( swA * a.armAmp * 0.9).toFixed(1) + ',0,-34)');
    o.armR.setAttribute('transform', 'rotate(' + (-swA * a.armAmp * 0.9).toFixed(1) + ',0,-34)');
  }

  g.SceneAnimator = { mount: mount, mountBoats: mountBoats, mountGround: mountGround, start: start, stop: stop, rebuildRefs: rebuildRefs, settle: settle };
})(typeof window !== 'undefined' ? window : globalThis);

// ============ 常量 ============
const VALUE_KEYS             = ['tresury', 'granary', 'people', 'security', 'reputation', 'population'];
const VALUE_MAX = 100;
const VALUE_MIN = 0;
const PERSONALITY_MAX = 100;
const PERSONALITY_MIN = -100;
const TERM_YEARS = 3;
const MONTHS_PER_YEAR = 12;

/** 出身影子：背景自动带一个出身标签（只用于剧情文案，不再单独选） */
const BACKGROUND_SHADOW                             = {
  wild: '捐官', ruin: '捐官', county: '举人', city: '进士',
};

/** 旧出身 → 背景映射（读旧存档 origin 字段时用） */
const LEGACY_ORIGIN_TO_BACKGROUND                                   = {
  jinshi: 'city', juren: 'county', juanguan: 'wild',
};

const INITIAL_VALUES                             = {
  wild:   { tresury: 35, granary: 40, people: 30, security: 20, reputation: 25, population: 20 },
  ruin:   { tresury: 25, granary: 35, people: 35, security: 30, reputation: 20, population: 25 },
  county: { tresury: 50, granary: 55, people: 50, security: 55, reputation: 50, population: 50 },
  city:   { tresury: 70, granary: 60, people: 55, security: 45, reputation: 70, population: 75 },
};
const INITIAL_PERSONALITY                                  = {
  wild:   { x: -10, y: -15 },
  ruin:   { x: 15, y: 0 },
  county: { x: 8, y: 10 },
  city:   { x: 0, y: 15 },
};

/** 随机 roll 一个背景：权重 wild 32 / ruin 32 / county 24 / city 12 */
function rollBackground()             {
  const W                         = [['wild', 32], ['ruin', 32], ['county', 24], ['city', 12]];
  let r = Math.random() * 100;
  for (const [k, w] of W) { r -= w; if (r <= 0) return k; }
  return 'wild';
}

// ============ 工具 ============
function clamp(v        , min        , max        )         {
  return Math.max(min, Math.min(max, Math.round(v)));
}
function clampValues(values        )         {
  const out = {}          ;
  for (const k of VALUE_KEYS) out[k] = clamp(values[k], VALUE_MIN, VALUE_MAX);
  return out;
}

/** 浮点 clamp（不取整），用于 taxRate/marketRate 等连续系数 */
function clampF(v        , min        , max        )         {
  return Math.max(min, Math.min(max, v));
}
function clampPersonality(p             )              {
  return { x: clamp(p.x, PERSONALITY_MIN, PERSONALITY_MAX), y: clamp(p.y, PERSONALITY_MIN, PERSONALITY_MAX) };
}

// ============ 游戏状态 ============
class GameState {
  values        ;
  personality             ;
  year        ;          // 1~3
  month        ;         // 1~12
  origin            ;    // 四种随机背景（存档字段名保留 origin，兼容旧值）
  taxRate = 1.0;         // 税赋系数
  marketRate = 1.0;      // 市集系数
  flags              = new Set();
  triggered              = new Set();
  pendingChains           = [];
  actionCooldowns                         = {};  // 政令冷却（月），每月递减
  stats           ;
  examHistory                                                   = [];
  eventLog           = [];

  constructor(origin             = 'wild') {
    this.origin = origin;
    this.values = { ...INITIAL_VALUES[origin] };
    this.personality = { ...INITIAL_PERSONALITY[origin] };
    this.year = 1;
    this.month = 1;
    this.stats = { populationStartOfYear: this.values.population, populationNetChange: 0, taxCollected: 0, taxTarget: 0, casesSolved: 0, casesTotal: 0 };
    this.stats.taxTarget = this.computeMonthlyIncome() * MONTHS_PER_YEAR;
  }

  get phase()                                            {
    if (this.month <= 3) return 'spring';
    if (this.month <= 6) return 'summer';
    if (this.month <= 9) return 'autumn';
    return 'winter';
  }

  // —— 月度收入 ——
  computeMonthlyIncome()         {
    const tianfu = this.values.population * 0.9 * this.taxRate;
    const shangshui = this.values.security * 0.35 * this.marketRate;
    return Math.round(tianfu + shangshui);
  }

  // —— 月度结算（v0 公式）——
  monthlySettle()       {
    const income = this.computeMonthlyIncome();
    const expense = 25 + 5; // 俸禄 25 + 仓储维护 5（v0 无工程摊销/赈济）
    const surplus = income - expense;
    this.values.tresury = clamp(this.values.tresury + Math.round(surplus * 0.35), VALUE_MIN, VALUE_MAX);
    if (this.flags.has('canal_wharf')) this.values.tresury = clamp(this.values.tresury + 2, VALUE_MIN, VALUE_MAX); // 运河码头商税
    if (this.values.population >= 55) this.values.granary = clamp(this.values.granary + 1, VALUE_MIN, VALUE_MAX);
    if (this.taxRate >= 1.1) this.values.people = clamp(this.values.people - 2, VALUE_MIN, VALUE_MAX);
    else this.values.people = clamp(this.values.people + 0.5, VALUE_MIN, VALUE_MAX);
    const popDelta = this.values.people >= 60 ? 0.4 : this.values.people <= 30 ? -0.6 : 0;
    this.values.population = clamp(this.values.population + popDelta, VALUE_MIN, VALUE_MAX);
    this.stats.taxCollected += income;
    this.stats.populationNetChange = this.values.population - this.stats.populationStartOfYear;
  }

  // —— 事件结算 ——
  applyChoice(choice        )       {
    const e = choice.effects;
    for (const k of Object.keys(e.values)              ) {
      this.values[k] = clamp(this.values[k] + (e.values[k] ?? 0), VALUE_MIN, VALUE_MAX);
    }
    this.personality = clampPersonality({
      x: this.personality.x + (e.personality.x ?? 0),
      y: this.personality.y + (e.personality.y ?? 0),
    });
    if (e.flag) for (const f of e.flag) this.flags.add(f);
  }

  markTriggered(eventId        )       {
    this.triggered.add(eventId);
  }

  /** 政令冷却逐月递减 */
  tickActionCooldowns()       {
    const out                         = {};
    for (const k of Object.keys(this.actionCooldowns)) {
      const v = this.actionCooldowns[k] - 1;
      if (v > 0) out[k] = v;
    }
    this.actionCooldowns = out;
  }

  /** 应用一个政令（数值/人格/flag/taxRate/marketRate/冷却） */
  applyAction(a            )       {
    const e = a.effects;
    for (const k of Object.keys(e.values)              ) {
      this.values[k] = clamp(this.values[k] + (e.values[k] ?? 0), VALUE_MIN, VALUE_MAX);
    }
    this.personality = clampPersonality({
      x: this.personality.x + (e.personality?.x ?? 0),
      y: this.personality.y + (e.personality?.y ?? 0),
    });
    if (e.flag) for (const f of e.flag) this.flags.add(f);
    if (a.setTaxRate) {
      this.taxRate = clampF(this.taxRate + a.setTaxRate, 0.6, 1.6);
    }
    if (a.setMarketRate) {
      this.marketRate = clampF(this.marketRate + a.setMarketRate, 0.6, 1.6);
    }
    if (a.cooldown) this.actionCooldowns[a.id] = a.cooldown;
  }

  enqueueChain(chain                      )       {
    if (chain) for (const c of chain) if (!this.pendingChains.includes(c)) this.pendingChains.push(c);
  }

  // —— 季度人格回摆（向 0 收敛）——
  quarterlyPersonalityDrift()       {
    const drift = (v        ) => (v > 0 ? Math.max(0, v - 2) : Math.min(0, v + 2));
    this.personality = clampPersonality({ x: drift(this.personality.x), y: drift(this.personality.y) });
  }

  // —— 年度考课（v0 公式）——
  evaluateExam()             {
    const popScore = clamp(this.stats.populationNetChange * 1.5, 0, 30);
    const ratio = this.stats.taxTarget > 0 ? this.stats.taxCollected / this.stats.taxTarget : 0;
    const taxScore = clamp(Math.round(ratio * 30), 0, 30);
    const secScore = clamp(this.values.security >= 60 ? 20 : this.values.security - 40, 0, 20);
    const caseScore = this.stats.casesTotal > 0 ? Math.round((this.stats.casesSolved / this.stats.casesTotal) * 10) : 5;
    const respScore = 6; // v0 默认"良"；负面应对在事件数据中用 flag 修正
    const score = popScore + taxScore + secScore + caseScore + respScore;
    const grade = this.gradeFor(score);
    return { score, grade, breakdown: { population: popScore, tax: taxScore, security: secScore, cases: caseScore, response: respScore } };
  }

  gradeFor(score        )         {
    if (score >= 90) return '上上';
    if (score >= 75) return '上';
    if (score >= 60) return '中上';
    if (score >= 45) return '中';
    if (score >= 30) return '中下';
    return '下';
  }

  advanceMonth()                    {
    this.month += 1;
    this.tickActionCooldowns();
    if (this.month > MONTHS_PER_YEAR) {
      this.month = 1;
      // 先结算刚刚结束的这一年的考课
      const exam = this.evaluateExam();
      this.examHistory.push({ year: this.year, score: exam.score, grade: exam.grade });
      this.year += 1;
      if (this.year > TERM_YEARS) return exam; // 任期结束（第 3 年考课已结算入档，仍需返回给上层展示）
      // 重置年度统计
      this.stats = { populationStartOfYear: this.values.population, populationNetChange: 0, taxCollected: 0, taxTarget: this.computeMonthlyIncome() * MONTHS_PER_YEAR, casesSolved: 0, casesTotal: 0 };
      return exam;
    }
    if (this.month % 3 === 1) this.quarterlyPersonalityDrift();
    return null;
  }

  /** 任期是否结束（3 年考课全部完成） */
  get termEnded()          {
    return this.year > TERM_YEARS && this.examHistory.length >= TERM_YEARS;
  }

  // —— 存档 ——
  serialize()         {
    return JSON.stringify({
      values: this.values, personality: this.personality, year: this.year, month: this.month,
      origin: this.origin, taxRate: this.taxRate, marketRate: this.marketRate,
      flags: [...this.flags], triggered: [...this.triggered], pendingChains: this.pendingChains,
      actionCooldowns: this.actionCooldowns,
      stats: this.stats, examHistory: this.examHistory,
    });
  }

  static deserialize(raw        )            {
    const s = JSON.parse(raw);
    // 旧存档的 origin 是出身(jinshi/juren/juanguan)，映射到新背景；新存档已是背景直接透传
    const bg = (s.origin in INITIAL_VALUES) ? s.origin : (LEGACY_ORIGIN_TO_BACKGROUND[s.origin] || 'wild');
    const gs = new GameState(bg);
    gs.values = s.values; gs.personality = s.personality; gs.year = s.year; gs.month = s.month;
    gs.taxRate = s.taxRate; gs.marketRate = s.marketRate;
    gs.flags = new Set(s.flags); gs.triggered = new Set(s.triggered); gs.pendingChains = s.pendingChains;
    gs.actionCooldowns = s.actionCooldowns ?? {};
    gs.stats = s.stats; gs.examHistory = s.examHistory;
    return gs;
  }
}

// ============ 事件系统 ============
class EventSystem {
          events              = [];

  static load(raw        )              {
    const es = new EventSystem();
    es.events = JSON.parse(raw).events               ;
    return es;
  }

  get all()              { return this.events; }

  find(id        )                        { return this.events.find(e => e.id === id); }

  /** 判断事件当前是否可触发（连锁事件同样必须满足触发条件，只是抽取时优先） */
  eligible(ev           , state           )          {
    if (ev.once && state.triggered.has(ev.id)) return false;
    if (ev.background && ev.background !== state.origin) return false;
    const t = ev.trigger ?? {};
    if (t.month && !t.month.includes(state.month)) return false;
    if (t.yearTerm && t.yearTerm !== state.year) return false;
    if (t.minYear && state.year < t.minYear) return false;
    if (t.maxYear && state.year > t.maxYear) return false;

  /** 抽取一个可触发事件：优先必发队列（满足条件的连锁事件），否则加权随机；无则返回 null */

class ActionSystem {
          actions               = [];

  static load(raw        )               {
    const as = new ActionSystem();
    as.actions = JSON.parse(raw).actions                ;
    return as;
  }

  get all()               { return this.actions; }

  find(id        )                         { return this.actions.find(a => a.id === id); }

  /** 政令当前是否可行 */
  eligible(a            , state           )          {
    if ((state.actionCooldowns[a.id] ?? 0) > 0) return false;
    const need = a.need ?? {};
    if (need.values) {
      for (const k of Object.keys(need.values)              ) {

      }

      if (p >= 0 && state.personality.x < p) return false;
      if (p < 0 && state.personality.x > p) return false;
    }
    if (need.personality?.y !== undefined) {
      const p = need.personality.y;
      if (p >= 0 && state.personality.y < p) return false;
      if (p < 0 && state.personality.y > p) return false;
    }
    if (need.flag && !state.flags.has(need.flag)) return false;
    return true;
  }

  /** 当前可行的全部政令 */
  available(state           )               {
    return this.actions.filter(a => this.eligible(a, state));
  }
}

        { "id": "B", "text": "封寨设卡，静待疫消", "effects": { "values": { "people": -6, "population": -5, "security": 2 }, "personality": { "x": -6, "y": 0 } }, "resultText": "寨子被封了两个月，疫病没传出来，可寨里的老人，也走了好几个。", "expose": true }
      ]

    {
      "id": "E25", "title": "蛮乡无学", "type": "people", "weight": 60, "once": true, "background": "wild",
      "phase": "any", "priority": "normal", "deadline": 3,
      "trigger": { "minYear": 2 },
      "text": "蛮荒之地，十户九不识字，民风剽悍，动辄械斗。有幕僚进言：欲化顽民，先立乡学。可山民连饭都吃不饱，哪有闲心读书。",
      "choices": [
        { "id": "A", "text": "设乡学，强令子弟入学", "effects": { "values": { "tresury": -6, "population": 4, "people": -2 }, "personality": { "x": 6, "y": 0 } }, "resultText": "乡学立起来了，夫子敲着戒尺念圣贤书。山民背地里说：吃饱肚子比认字要紧。", "expose": true },
        { "id": "B", "text": "先赈济，再徐徐教化", "effects": { "values": { "granary": -8, "people": 6, "reputation": 2 }, "personality": { "x": 8, "y": 0 } }, "resultText": "仓里的粮食见了底，山民脸上的戾气倒散了几分。都说这任县官，是个体恤人的。", "expose": true },
        { "id": "C", "text": "暂缓教化，专治械斗", "effects": { "values": { "security": 6, "people": -3 }, "personality": { "x": -4, "y": 0 } }, "resultText": "几场械斗都被压了下去，街面清净了。只是根子上的愚顽，一点没动。", "expose": true }
      ]
    },
    {
      "id": "E26", "title": "土司纳贡", "type": "official", "weight": 55, "once": true, "background": "wild",
      "phase": "autumn", "priority": "normal", "deadline": 2,
      "trigger": { "minYear": 1 },
      "text": "附近土司遣使来贺新任县官，抬来一箱兽皮山货，还带话：愿替朝廷管束山中夷民，只求朝廷发一纸委任。收下，土司与你交好；不收，怕他面子上过不去。",
      "choices": [
        { "id": "A", "text": "收礼，上奏请委土司", "effects": { "values": { "tresury": 5, "security": 3, "reputation": -3 }, "personality": { "x": 0, "y": -6 } }, "resultText": "土司得了委任，山中夷民归他管束，县里省了心。只是『以夷制夷』，终究是笔说不清的交易。", "expose": true },
        { "id": "B", "text": "收礼不办事，虚与委蛇", "effects": { "values": { "tresury": 5, "security": -2 }, "personality": { "x": 0, "y": -10 } }, "resultText": "礼收了，委任的事你却一拖再拖。土司那边，笑容渐渐冷了下去。", "expose": true }
      ]
    },
    {
      "id": "E27", "title": "野狼成患", "type": "security", "weight": 50, "once": true, "background": "wild",
      "phase": "winter", "priority": "urgent", "deadline": 1,
      "trigger": { "month": [12, 1, 2] },
      "text": "入冬以来野狼成群下山，叼走牛羊，还咬伤了夜归的农户。乡勇请命去猎，只求县里补些火铳弓箭的银子。",
      "choices": [
        { "id": "A", "text": "拨银购置猎具，组织乡勇围猎", "effects": { "values": { "tresury": -4, "security": 4, "people": 3 }, "personality": { "x": 4, "y": 0 } }, "resultText": "乡勇扛着火铳上了山，半月后抬着几条狼下来。村寨里终于能睡个安稳觉。", "expose": true }
      ]
    },
    {
      "id": "E28", "title": "流民垦荒", "type": "people", "weight": 70, "once": true, "background": "ruin",
      "phase": "spring", "priority": "normal", "deadline": 3,
      "trigger": { "minYear": 1 },
      "text": "战乱初平，大片良田抛荒。一批流民逃难到此，愿留下来垦荒落户，只求官府发点种子农具。招垦，户口充实；可这些人来路不明，难保没有奸细混入。",
      "choices": [
        { "id": "A", "text": "发给种子农具，编户安置", "effects": { "values": { "tresury": -6, "granary": -3, "population": 8, "people": 5 }, "personality": { "x": 6, "y": 0 } }, "resultText": "荒田里重新长出了青苗，逃难的人家落了户。来年，他们便是纳粮的编户了。", "expose": true },
        { "id": "B", "text": "甄别后择优安置", "effects": { "values": { "tresury": -3, "population": 3, "people": -2 }, "personality": { "x": 0, "y": 0 } }, "resultText": "老弱被遣散，精壮留下垦荒。田是垦出来了，可城门外又多了一片哭声。", "expose": true },
        { "id": "C", "text": "拒之门内，驱赶出境", "effects": { "values": { "people": -6, "security": 2 }, "personality": { "x": -6, "y": 0 } }, "resultText": "流民拖着步子走了，荒田依旧荒着。你安慰自己：多一事不如少一事。", "expose": true }
      ]
    },
    {
      "id": "E29", "title": "兵燹余烬", "type": "security", "weight": 65, "once": true, "background": "ruin",
      "phase": "any", "priority": "urgent", "deadline": 2,
      "trigger": { "minYear": 1 },
      "text": "战火虽熄，余烬未灭。城外常有散兵游勇和溃兵落草，昼伏夜出，劫掠村落。缉捕，兵力不足；招抚，他们手上都沾着血。",
      "choices": [
        { "id": "A", "text": "收编溃兵，充作守卒", "effects": { "values": { "tresury": -5, "security": 5, "people": -4 }, "personality": { "x": -2, "y": 0 } }, "resultText": "溃兵穿上了号衣，转身成了守卒。乡民看他们的眼神，却像在看狼。", "expose": true },
        { "id": "B", "text": "设卡清剿，格杀勿论", "effects": { "values": { "tresury": -8, "security": 8, "reputation": -3 }, "personality": { "x": -6, "y": 0 } }, "resultText": "城门外挂起几颗首级，匪患为之一清。只是夜半总有妇人的哭声，顺着风飘进县衙。", "expose": true },
        { "id": "C", "text": "悬赏告发，离间瓦解", "effects": { "values": { "tresury": -4, "security": 3 }, "personality": { "x": 0, "y": -3 } }, "resultText": "重赏之下，有人告发了自己的袍泽。匪帮散了，人心也散了。", "expose": true }
      ]
    },
    {
      "id": "E30", "title": "断桥残堤", "type": "finance", "weight": 60, "once": true, "background": "ruin",
      "phase": "spring", "priority": "urgent", "deadline": 3,
      "trigger": { "minYear": 1 },
      "text": "兵燹之后，城西石桥坍塌，河堤千疮百孔。修桥固堤，是重建第一要务，可府库空空如也。士绅们缩着脖子，没人肯先掏钱。",
      "choices": [
        { "id": "A", "text": "以工代赈，征发民夫", "effects": { "values": { "tresury": -6, "granary": -4, "people": 4, "reputation": 2 }, "personality": { "x": 5, "y": 0 } }, "resultText": "河堤桥面渐渐成形，做工的灾民吃上了饭。虽是苦役，倒也没人真闹。", "expose": true },
        { "id": "B", "text": "摊派到户，强征银两", "effects": { "values": { "tresury": 6, "people": -8, "security": -3 }, "personality": { "x": -8, "y": 0 } }, "resultText": "银两凑齐了，桥也修了。只是刚遭了兵灾的百姓，又被剥了一层。", "expose": true }
      ]
    },
    {
      "id": "E31", "title": "流兵为匪", "type": "security", "weight": 55, "once": true, "background": "ruin",
      "phase": "autumn", "priority": "urgent", "deadline": 3,
      "trigger": { "minYear": 2 },
      "text": "一支败军残部游荡到县界，约三百人，挟刀带枪，为首者自称『将军』，扬言要粮要饷，否则自取。是抚是剿，全在你一念之间。",
      "choices": [
        { "id": "A", "text": "招抚为首者，编入县兵", "effects": { "values": { "tresury": -8, "security": 4, "people": -3 }, "personality": { "x": 2, "y": -3 }, "flag": ["fubing_shoubian"] }, "resultText": "『将军』改称了『把总』，兵还是那帮兵。是福是祸，看往后了。", "expose": true },
        { "id": "B", "text": "密约邻县，夹击围剿", "effects": { "values": { "tresury": -10, "security": 8, "reputation": 3 }, "personality": { "x": -4, "y": 2 } }, "resultText": "三县合兵，把残部围在了山坳里。一场血战，匪患彻底平息。", "expose": true },
        { "id": "C", "text": "给粮给银，送其出境", "effects": { "values": { "tresury": -12, "granary": -6, "security": -2 }, "personality": { "x": 0, "y": -4 } }, "resultText": "粮银送出，残部果然拔营走了。只是祸水东引，邻县骂你自私。", "expose": true },
        { "id": "D", "text": "虚与周旋，暗中调兵", "effects": { "values": { "tresury": -6, "security": 5 }, "personality": { "x": 3, "y": -2 } }, "resultText": "你一面与其周旋，一面密调乡勇。等残部察觉，已成合围之势。", "expose": true }
      ]
    },
    {
      "id": "E32", "title": "重建义学", "type": "people", "weight": 55, "once": true, "background": "ruin",
      "phase": "any", "priority": "normal", "deadline": 3,
      "trigger": { "minYear": 2 },
      "text": "战乱让县学毁于一旦，读书人死的死、散的散。有退隐的老儒愿出山执掌义学，只求县里修缮学舍、供给束脩。",
      "choices": [
        { "id": "A", "text": "拨银修缮，请老儒执教", "effects": { "values": { "tresury": -6, "population": 4, "reputation": 5 }, "personality": { "x": 4, "y": 3 } }, "resultText": "学舍修葺一新，书声琅琅又起。老儒抚着胡须：这才是重兴文教之始。", "expose": true },
        { "id": "B", "text": "先修衙署，义学缓办", "effects": { "values": { "tresury": -5, "reputation": -4, "people": -2 }, "personality": { "x": -3, "y": -4 } }, "resultText": "县衙倒是气派了，义学的事却没了下文。读书人背地里直摇头。", "expose": true },
        { "id": "C", "text": "劝士绅捐资共办", "effects": { "values": { "population": 3, "reputation": 1 }, "personality": { "x": 2, "y": -3 } }, "resultText": "士绅捐了银子，也顺势塞进来两个自家子侄当助教。义学开了，风气微妙。", "expose": true }
      ]
    },
    {
      "id": "E33", "title": "豪绅争讼", "type": "justice", "weight": 65, "once": true, "background": "county",
      "phase": "any", "priority": "urgent", "deadline": 2,
      "trigger": { "minYear": 2 },
      "text": "县城虽小，豪绅却多。两家士绅为了一块祖传的地皮对簿公堂，各持地契，各有一帮乡党助威。堂外已经聚了上百看客，等着看你这新官怎么断。",
      "choices": [
        { "id": "A", "text": "升堂问案，秉公而断", "need": { "values": { "tresury": 20, "security": 25 } }, "effects": { "values": { "people": 6, "reputation": 6, "security": -3 }, "personality": { "x": 4, "y": 6 }, "caseSolved": true }, "resultText": "惊堂木落，田契真假当堂辨明。赢了的一方千恩万谢，输了的一方，记下了这梁子，连着几日带着家丁在衙外叫嚣。", "expose": true },
        { "id": "B", "text": "拖字诀，请两造和解", "effects": { "values": { "people": -2, "reputation": -2 }, "personality": { "x": 0, "y": -3 } }, "misjudge": { "chance": 0.3, "effects": { "values": { "people": -5, "reputation": -5 }, "personality": { "x": 0, "y": -4 } }, "resultText": "案子拖了三个月，两家耗不过，最终各让一步——可这一让，让出个『地契另有隐情』的流言，县里都说你敷衍了事。" }, "resultText": "案子拖了三个月，两家耗不过，最终各让一步。可你这知县，也落了个『和稀泥』的名声。", "expose": true },
        { "id": "C", "text": "看谁势力大，偏向谁", "effects": { "values": { "tresury": 8, "people": -6, "reputation": -5 }, "personality": { "x": -4, "y": -10 } }, "resultText": "势大的一方赢了官司，也悄悄送来了谢礼。堂外百姓看你的眼神，变了。", "expose": true }
      ]
    },
    {
      "id": "E34", "title": "赋税摊派", "type": "finance", "weight": 60, "once": true, "background": "county",
      "phase": "autumn", "priority": "urgent", "deadline": 2,
      "trigger": { "minYear": 2 },
      "text": "上峰摊派的额征银又加了三分，各里正叫苦不迭。照数摊下去，贫户要揭不开锅；往上陈情减免，又怕落个『办事不力』的考语。",
      "choices": [
        { "id": "A", "text": "照数摊派，雷厉风行", "effects": { "values": { "tresury": 8, "people": -8, "security": -2 }, "personality": { "x": -6, "y": 0 } }, "resultText": "额征如期足数，上峰嘉许。只是交不起税的人家，夜里悄悄上了山。", "expose": true },
        { "id": "B", "text": "陈情减免，为民请命", "effects": { "values": { "tresury": -4, "people": 6, "reputation": 3 }, "personality": { "x": 6, "y": 2 } }, "resultText": "减免文书批了下来，百姓得了实惠。上峰却记了你一笔：此人不好支使。", "expose": true },
        { "id": "C", "text": "摊富户，免贫户", "effects": { "values": { "tresury": 4, "people": 2, "reputation": -2 }, "personality": { "x": 3, "y": -3 } }, "resultText": "富户多出了血，贫户缓了口气。可富户们的轿子，从此再不登你的门。", "expose": true },
        { "id": "D", "text": "先收三成，余者拖到年底", "effects": { "values": { "tresury": 2, "people": -2 }, "personality": { "x": 0, "y": -2 } }, "resultText": "先收三成，剩下的年底再说。眼看年关将至，缺口还大得很。", "expose": true }
      ]
    },
    {
      "id": "E35", "title": "河工贪墨", "type": "official", "weight": 55, "once": true, "background": "county",
      "phase": "summer", "priority": "urgent", "deadline": 2,
      "trigger": { "minYear": 2 },
      "text": "查账时发现，去岁河工银两被工房书吏伙同包工头贪墨了三成，如今河堤偷工减料，隐患重重。彻查，牵连甚广，甚至可能牵出前任县官；轻轻放下，则河堤迟早出事。",
      "choices": [
        { "id": "A", "text": "彻查到底，追赃严办", "effects": { "values": { "tresury": 4, "reputation": 5, "security": -2 }, "personality": { "x": 2, "y": 8 }, "flag": ["hegong_yancha"] }, "resultText": "书吏下狱，包工头收押，赃银追回大半。只是衙中上下，人人自危。", "expose": true },
        { "id": "B", "text": "敲山震虎，只办几个小的", "effects": { "values": { "tresury": 2, "reputation": 1 }, "personality": { "x": 0, "y": -2 } }, "resultText": "几个小角色顶了罪，大头神不知鬼不觉。你告诉自己：水至清则无鱼。", "expose": true },
        { "id": "C", "text": "密奏上峰，请其定夺", "effects": { "values": { "reputation": 2, "tresury": -2 }, "personality": { "x": 0, "y": 4 } }, "resultText": "密奏递了上去，却如石沉大海，打点递奏的使费也花了不少。后来你才知道，前任县官如今正是你的上峰。", "expose": true }
      ]
    },
    {
      "id": "E36", "title": "疫病城封", "type": "disaster", "weight": 65, "once": true, "background": "county",
      "phase": "any", "priority": "urgent", "deadline": 2,
      "trigger": { "minYear": 3 },
      "text": "发展起来的县城，人烟稠密，一场时疫悄然流行。封城，商旅断绝；不封，疫情恐一发不可收拾。这是对你这三年治理的终极大考。",
      "choices": [
        { "id": "A", "text": "封城设坊，严加隔离", "effects": { "values": { "tresury": -8, "security": -4, "people": 8 }, "personality": { "x": 8, "y": 0 } }, "resultText": "城门紧闭，隔离坊药气氤氲。三个月后疫消，县城保住了，商税却赔进去不少。", "expose": true },
        { "id": "B", "text": "封锁消息，照常开市", "effects": { "values": { "tresury": 4, "population": -10, "reputation": -8 }, "personality": { "x": -10, "y": 0 } }, "resultText": "市面照旧，银子照赚。可疫情瞒不住，等上面查下来，你的乌纱帽也保不住了。", "expose": true },
        { "id": "C", "text": "募捐设医，半封半放", "effects": { "values": { "tresury": -4, "people": 4 }, "personality": { "x": 4, "y": 0 } }, "resultText": "医馆设起来了，街面半开半闭。疫情总算没有失控，只是拖得久了些。", "expose": true }
      ]
    },
    {
      "id": "E37", "title": "商帮挤兑", "type": "finance", "weight": 55, "once": true, "background": "county",
      "phase": "any", "priority": "urgent", "deadline": 2,
      "trigger": { "minYear": 3 },
      "text": "县城钱庄突遭挤兑，谣传东家卷款外逃。商户们堵在门口讨要银两，眼看要闹出人命。查实放话安抚，还是先抓几个造谣的？",
      "choices": [
        { "id": "A", "text": "调库银，帮钱庄渡兑", "effects": { "values": { "tresury": -10, "people": 5, "reputation": 3 }, "personality": { "x": 5, "y": 0 } }, "resultText": "官银入柜，兑付如常，一场风波平了。可县库为之一空，师爷的脸都白了。", "expose": true },
        { "id": "B", "text": "抓造谣者，杀一儆百", "effects": { "values": { "security": 3, "people": -5 }, "personality": { "x": -6, "y": 0 } }, "resultText": "几个传谣的抓了，可恐慌没止住，反而越传越邪乎。", "expose": true }
      ]
    },
    {
      "id": "E38", "title": "豪强圈地", "type": "justice", "weight": 65, "once": true, "background": "city",
      "phase": "any", "priority": "urgent", "deadline": 2,
      "trigger": { "minYear": 1, "maxYear": 1 },
      "text": "繁华之地，豪强势大。城中豪强借买地之名强占城外良田，苦主告到衙前。你初来乍到，根基未稳，各方关系盘根错节。",
      "choices": [
        { "id": "A", "text": "秉公断案，退还田产", "need": { "values": { "tresury": 25, "security": 25 } }, "effects": { "values": { "people": 6, "security": -3, "reputation": 8 }, "personality": { "x": 12, "y": 8 }, "caseSolved": true }, "resultText": "豪强败诉，田产物归原主，满城称快。可豪强临走撂下话：来日方长，夜里真有几块石头砸进了县衙。", "expose": true },
        { "id": "B", "text": "两边安抚，各退一步", "effects": { "values": { "people": 1, "reputation": -3 }, "personality": { "x": 0, "y": -6 } }, "misjudge": { "chance": 0.3, "effects": { "values": { "people": -4, "reputation": -7 }, "personality": { "x": -2, "y": -6 } }, "resultText": "『各退一步』退成了糊涂账，苦主吞不下这口气，一路告到了知府那里。上头批下来：查核不实，记过。", "caseSolved": false }, "resultText": "案是结了，可谁都不领情。苦主说你不公，豪强嫌你多事。", "expose": true },
        { "id": "C", "text": "收豪强谢礼，判归豪强", "effects": { "values": { "tresury": 12, "people": -8, "security": -4 }, "personality": { "x": -10, "y": -15 }, "flag": ["taken_bribe"] }, "resultText": "钱袋子鼓了，可你的官声蒙了灰。夜里总梦见那苦主跪在衙前。", "expose": true },
        { "id": "D", "text": "先拖一拖，看风头再说", "effects": { "values": { "reputation": -2 }, "personality": { "x": -3, "y": -3 } }, "misjudge": { "chance": 0.35, "effects": { "values": { "reputation": -6, "people": -4 }, "personality": { "x": -3, "y": -5 } }, "resultText": "案子悬着，苦主日日来衙前哭诉。看客越聚越多，都在看你几时开堂——拖到最后，这案子的对错，城里早已替你定了。" }, "resultText": "案子悬着，苦主日日来衙前哭诉。看客越聚越多，都在看你几时开堂。", "expose": true }
      ]
