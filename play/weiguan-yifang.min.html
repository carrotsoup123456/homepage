    {
      "id": "E39", "title": "火患连城", "type": "disaster", "weight": 60, "once": true, "background": "city",
      "phase": "any", "priority": "urgent", "deadline": 2,
      "trigger": { "minYear": 1 },
      "text": "大都市房舍鳞次栉比，一场大火从城南烧起，火借风势，直扑闹市。救火要拆房断火道，拆谁家谁骂娘；不拆，整条街都要化为灰烬。",
      "choices": [
        { "id": "A", "text": "当机立断，拆房断火", "effects": { "values": { "tresury": -6, "people": -4, "security": 4 }, "personality": { "x": -2, "y": 0 } }, "resultText": "几排房舍被推倒，火势止住了。被拆的人家堵在衙门口要说法。", "expose": true },
        { "id": "B", "text": "组织救火，挨户扑救", "effects": { "values": { "tresury": -10, "people": 3 }, "personality": { "x": 4, "y": 0 } }, "resultText": "火总算扑灭了，累倒了一地人。算下来，烧毁的房舍比预想的还多。", "expose": true },
        { "id": "C", "text": "先顾官仓，火势失控", "effects": { "values": { "tresury": -2, "people": -8, "reputation": -6 }, "personality": { "x": -6, "y": 0 } }, "resultText": "官仓保住了，民宅烧掉半条街。百姓骂你：只顾自己的乌纱帽。", "expose": true }
      ]
    },
    {
      "id": "E40", "title": "盐商争利", "type": "finance", "weight": 55, "once": true, "background": "city",
      "phase": "any", "priority": "urgent", "deadline": 2,
      "trigger": { "minYear": 1 },
      "text": "盐市利润丰厚，几家盐商为争专营权闹到衙前，各怀银票，各递拜帖。大都市里，一场盐引之争，牵动半城商脉。",
      "choices": [
        { "id": "A", "text": "只许势大者专营", "effects": { "values": { "tresury": 10, "reputation": -4 }, "personality": { "x": -3, "y": -8 } }, "resultText": "专营权给了最势大的一家，银子流水般进府。被排挤的盐商，转头就参了你一本。", "expose": true },
        { "id": "B", "text": "诸商共营，划界分利", "effects": { "values": { "tresury": 3, "reputation": 3, "people": 2, "security": -2 }, "personality": { "x": 2, "y": 2 } }, "resultText": "几家盐商各得一块地盘，相安无事。只是划界的空当，免不了有人越界抢货，纠纷不断。", "expose": true },
        { "id": "C", "text": "借机彻查，整顿盐市", "effects": { "values": { "tresury": -4, "reputation": 6 }, "personality": { "x": 4, "y": 10 } }, "resultText": "盐市账目查了个底朝天，走私夹带无所遁形。盐商恨你，百姓敬你。", "expose": true },
        { "id": "D", "text": "收重礼，两不得罪", "effects": { "values": { "tresury": 15, "reputation": -8 }, "personality": { "x": -4, "y": -14 }, "flag": ["taken_bribe"] }, "resultText": "银子收了，事却拖成了糊涂账。盐商们背后都说：这官，好糊弄。", "expose": true },
        { "id": "E", "text": "奏请朝廷，另发盐引", "effects": { "values": { "reputation": 2, "tresury": -2 }, "personality": { "x": 1, "y": 4 } }, "resultText": "一纸奏章递进京，等着朝廷另发盐引。只是这批复，不知何年何月。", "expose": true }
      ]
    },
    {
      "id": "E41", "title": "权贵索贿", "type": "official", "weight": 55, "once": true, "background": "city",
      "phase": "any", "priority": "urgent", "deadline": 2,
      "trigger": { "minYear": 1 },
      "text": "京城权贵的管家登门，话里有话：贵府三公子想在本地做点『买卖』，还望县尊行个方便。所谓方便，无非是免查、免税、免问。",
      "choices": [
        { "id": "A", "text": "虚与委蛇，应承下来", "effects": { "values": { "tresury": 6, "security": -4 }, "personality": { "x": 0, "y": -8 }, "flag": ["bribed_quangui"] }, "resultText": "权贵得了方便，也给你留了几分薄面。可这条暗线，从此拴住了你。", "expose": true },
        { "id": "B", "text": "婉言谢绝，公事公办", "effects": { "values": { "reputation": 5, "security": 2, "tresury": -3 }, "personality": { "x": 2, "y": 10 } }, "resultText": "你客客气气把管家送走，转身就嘱咐衙役照章办事。权贵那边，记下了你这号人，上峰对你的脸色也难看了几分。", "expose": true }
      ]
    },
    {
      "id": "E42", "title": "帮派火并", "type": "security", "weight": 55, "once": true, "background": "city",
      "phase": "any", "priority": "urgent", "deadline": 2,
      "trigger": { "minYear": 1 },
      "text": "大都市鱼龙混杂，两大帮派为争码头地盘大打出手，闹市见血，人心惶惶。是铁腕镇压，还是招安收编，或是坐山观虎斗？",
      "choices": [
        { "id": "A", "text": "铁腕镇压，两帮并剿", "effects": { "values": { "security": 6, "reputation": 3, "tresury": -5 }, "personality": { "x": -4, "y": 2 } }, "resultText": "两帮头目锁拿归案，街面为之一清。只是码头一时无人打点，货运乱了套。", "expose": true },
        { "id": "B", "text": "扶弱抑强，令其制衡", "effects": { "values": { "security": 2, "tresury": -2 }, "personality": { "x": 0, "y": -4 } }, "resultText": "弱的一帮得了默许，与强帮势均力敌。码头是稳了，可你心里清楚，这火并迟早再来。", "expose": true },
        { "id": "C", "text": "坐山观虎斗，两败俱伤后再收", "effects": { "values": { "security": 3, "people": -4 }, "personality": { "x": -3, "y": -2 } }, "resultText": "两帮斗得两败俱伤，你才出手收拾残局。街面是定了，可死伤百姓的账，有人记着。", "expose": true }
      ]
    },
    {
      "id": "E43", "title": "流民拥城", "type": "people", "weight": 100, "once": true,
      "phase": "any", "priority": "urgent", "deadline": 2,
      "trigger": { "requireEvent": "E01" },
      "text": "春旱之后，邻县流民闻风涌入本县，黑压压挤在城下讨口饭吃。粥棚已经支起来，可这点粮食，撑不了几天。",
      "choices": [
        { "id": "A", "text": "开仓扩粥，收容垦荒", "effects": { "values": { "granary": -12, "people": 8, "population": 3 }, "personality": { "x": 8, "y": 2 } }, "resultText": "粥棚添了灶，流民暂得温饱，还分到了城外的荒地。只是仓里的粮食，见了底。", "expose": true, "chain": ["E44"] },
        { "id": "B", "text": "调兵弹压，驱散流民", "effects": { "values": { "security": 4, "people": -10, "reputation": -3 }, "personality": { "x": -8, "y": 0 } }, "resultText": "兵丁列队，流民四散。城下哭声骂声混成一片，夜里有人往县衙墙上扔了石块。", "expose": true, "chain": ["E45"] }
      ]
    },
    {
      "id": "E44", "title": "流民感恩", "type": "people", "weight": 100, "once": true,
      "phase": "any", "priority": "normal", "deadline": 1,
      "trigger": { "requireEvent": "E43" },
      "text": "被你收留的流民在城外垦荒落户，秋收时，他们推着独轮车，送来了第一担新粮。",
      "choices": [
        { "id": "A", "text": "收下新粮，编入户籍", "effects": { "values": { "people": 6, "population": 4, "granary": 4 }, "personality": { "x": 4, "y": 2 } }, "resultText": "荒地上有了人家，户口册上添了名姓。这一局，你赌对了人心。", "expose": true }
      ]
    },
    {
      "id": "E45", "title": "流民之怨", "type": "security", "weight": 100, "once": true,
      "phase": "any", "priority": "urgent", "deadline": 2,
      "trigger": { "requireEvent": "E43" },
      "text": "被驱散的流民在县界外落了草，昼伏夜出，时有劫掠。官道上渐渐不太平了。",
      "choices": [
        { "id": "A", "text": "派兵进剿，扫平匪巢", "effects": { "values": { "security": 2, "tresury": -6, "people": -2 }, "personality": { "x": -4, "y": 0 } }, "resultText": "匪患暂平，兵饷又花去不少。只是那些本就是逼上山的百姓，谁也记不清了。", "expose": true },
        { "id": "B", "text": "派员招抚，安置归农", "effects": { "values": { "tresury": -8, "people": 4, "security": -2 }, "personality": { "x": 6, "y": 2 } }, "resultText": "回头是岸，人心渐归。散了伙的人家，又回来垦荒种地了。", "expose": true }
      ]
    }
  ]
}

const RANK_MAX = 7; // p7 起步
function rankIndex(gs){
  if(!gs || !gs.examHistory) return 0;
  let up = 0;
  for(const h of gs.examHistory){
    if(h.grade === '上上') up += 1;
    else if(h.grade === '上') up += 0.5;
  }
  return Math.min(RANK_MAX - 1, Math.floor(up));
}
function currentRank(gs){ return RANKS[rankIndex(gs)]; }

// 八维雷达图：六项数值 + 税赋 + 市集，各轴量程不一，统一归一化到 0~100 再画
function octRadarSVG(gs){
  const keys = ['tresury','granary','people','security','reputation','population','tax','market'];
  const n = keys.length, cx = 60, cy = 60, R = 46;
  const RAW = {
    tresury: gs.values.tresury, granary: gs.values.granary, people: gs.values.people,
    security: gs.values.security, reputation: gs.values.reputation, population: gs.values.population,
  };
  const MAX = { tresury:100, granary:100, people:100, security:100, reputation:100, population:100, tax:160, market:160 };
  const t1 = gs.taxRate != null ? gs.taxRate : 1.0;         // 税赋：1.0=常平→50，0.6~1.6 映射 0~100
  const m1 = gs.marketRate != null ? gs.marketRate : 1.0;    // 市集：同上
  const tPct = ((t1 - 0.6) / 1.0) * 100;
  const mPct = ((m1 - 0.6) / 1.0) * 100;
  const VAL = {
    tresury: RAW.tresury, granary: RAW.granary, people: RAW.people, security: RAW.security,
    reputation: RAW.reputation, population: RAW.population, tax: tPct, market: mPct,
  };
  const pt = (i, r) => {
    const a = -Math.PI/2 + i*(2*Math.PI/n);
    return [ (cx + r*Math.cos(a)).toFixed(1), (cy + r*Math.sin(a)).toFixed(1) ];
  };
  const ring = keys.map((_,i)=>pt(i,R).join(',')).join(' ');
  const val = keys.map((k,i)=>{ const r = R * Math.max(0, Math.min(100, VAL[k]))/100; return pt(i,r).join(','); }).join(' ');
  const grid = [0.25,0.5,0.75].map(f=>keys.map((_,i)=>pt(i,R*f).join(',')).join(' '))
    .map(pts=>`<polygon points="${pts}" fill="none" stroke="#8a6a30" stroke-width="0.5" opacity="0.4"/>`).join('');
  const axis = keys.map((_,i)=>`<line x1="${cx}" y1="${cy}" x2="${pt(i,R)[0]}" y2="${pt(i,R)[1]}" stroke="#8a6a30" stroke-width="0.5" opacity="0.5"/>`).join('');
  const NAMES = { tresury:'银库', granary:'粮仓', people:'民心', security:'治安', reputation:'官声', population:'人口', tax:'税赋', market:'市集' };
  const labels = keys.map((k,i)=>{ const lx = pt(i,R+13)[0], ly = pt(i,R+13)[1];
    return `<text x="${lx}" y="${ly}" font-size="8.5" fill="#6a5a40" text-anchor="middle" font-family="serif">${NAMES[k]}</text>`; }).join('');
  return `<svg viewBox="0 0 120 120" class="oct-radar" xmlns="http://www.w3.org/2000/svg">
    ${grid}${axis}
    <polygon points="${ring}" fill="none" stroke="#8a6a30" stroke-width="1.2"/>
    <polygon points="${val}" fill="rgba(47,106,82,0.25)" stroke="var(--frame)" stroke-width="1.6"/>
    ${labels}
  </svg>`;
}
// 决策状态栏：事件选择时置顶，平时隐藏（八维雷达 + 全数值，替代常驻状态栏）
function showDecisionBar(){
  const db = $('decisionBar'); const gs = state.gs; if(!db || !gs) return;
  // 八维：六项数值 + 税赋 + 市集（市集、税赋显示原系数，标注量程）
  const valsHtml = VALUE_KEYS_.map(k =>
    `<span>${esc(VALUE_NAMES[k]||k)} <b>${Math.round(gs.values[k])}</b></span>`).join('') +
    `<span>税赋 <b>${Math.round((gs.taxRate!=null?gs.taxRate:1.0)*100)}%</b></span>` +
    `<span>市集 <b>${Math.round((gs.marketRate!=null?gs.marketRate:1.0)*100)}%</b></span>` +
    `<span>仁政 <b>${gs.personality.x}</b></span>` +
    `<span>清廉 <b>${gs.personality.y}</b></span>`;
  db.innerHTML = octRadarSVG(gs) + `<div class="vals">${valsHtml}</div>`;
  db.classList.add('on');
  // 决策栏已接管全部数值，隐藏常驻状态栏避免重复展示
  const sb = $('statusBox'); if(sb) sb.classList.add('off');
}
function hideDecisionBar(){
  const db = $('decisionBar'); if(db) db.classList.remove('on');
  const sb = $('statusBox'); if(sb) sb.classList.remove('off');
}
function refreshStatus(){
  const gs = state.gs; if(!gs){ $('statusBox').innerHTML=''; return; }
  // 官服主题同步：当前品级色驱动所有面板边框（随升迁换色，默认 p7 青绿）
  const r = currentRank(gs);
  if(document.documentElement){
    document.documentElement.style.setProperty('--frame', r.color);
    document.documentElement.style.setProperty('--frame-deep', r.deep);
  }
  const valsHtml = VALUE_KEYS_.map(k =>

  $('statusBox').innerHTML = `<div class="idline"><b>${bgInfo(gs.origin).name} · ${bgInfo(gs.origin).shadow}出身</b> · 第 ${gs.year} 年 ${gs.month} 月${rankPill(gs)}</div>` +
    `<div class="vals">${valsHtml}</div>` +
    `<div class="meta-line">仁政 ${gs.personality.x}　清廉 ${gs.personality.y}　税赋 ${Math.round(gs.taxRate*100)}%</div>`;

// ===================== 背景音乐 =====================
// 按治理阶段（繁华度三档 + 官声高位的"太平"档）选曲；每阶段多首轮播，
// 一首播完（onended）才切下一首，阶段切换不打断当前曲，等它放完再进新阶段的歌。
function bgmStageOf(gs){
  if(!gs) return 0;
  const prosperity = Math.max(0, Math.min(1, (gs.values.population + gs.values.people + gs.values.tresury) / 300));
  if(prosperity >= 0.92 && gs.values.reputation >= 75) return 3;   // 太平：富庶 + 官声鼎盛
  if(prosperity >= 0.8)  return 2;                                 // 鼎盛
  if(prosperity >= 0.55) return 1;                                 // 起色
  return 0;                                                        // 草创
}
function bgmPool(stage){
  const tracks = BGM_TRACKS_[stage] || [];
  // 该阶段没曲目时向下取最近的可用阶段（确保永远有得播）
  if(tracks.length) return tracks;
  for(let s = stage; s >= 0; s--){ const t = BGM_TRACKS_[s]||[]; if(t.length) return t; }
  for(let s = stage; s < BGM_STAGE_COUNT_; s++){ const t = BGM_TRACKS_[s]||[]; if(t.length) return t; }
  return [];
}
function bgmUpdate(){
  const el = $('bgm'); if(!el || !state.gs) return;
  const stage = bgmStageOf(state.gs);
  if(stage === state._bgmStage) return;   // 阶段未变，不打断当前曲
  state._bgmStage = stage;
  const pool = bgmPool(stage);
  if(!pool.length) return;
  let i = state._bgmNext[stage] || 0;
  if(i >= pool.length) i = 0;
  const t = pool[i];
  el.src = t.data;
  el.volume = 0.5;
  const p = el.play && el.play();
  if(p && p.catch) p.catch(function(){});   // 自动播放被浏览器拦截时静默（用户点界面后再触发）
}
// 一首播完：本阶段播下一首（轮播），并顺手同步阶段（阶段可能已变）
function bgmNext(){
  if(!state.gs) return;
  const stage = state._bgmStage;
  const pool = bgmPool(stage);
  if(pool.length){
    let i = (state._bgmNext[stage] || 0) + 1;
    if(i >= pool.length) i = 0;
    state._bgmNext[stage] = i;
    const el = $('bgm');
    el.src = pool[i].data;
    const p = el.play && el.play();
    if(p && p.catch) p.catch(function(){});
  }
  bgmUpdate();   // 若阶段已变，这里补一次切换（不打断正在播的，只是把游标对准新阶段）
}
function toggleBgm(){
  state._bgmMuted = !state._bgmMuted;
  const el = $('bgm'), btn = $('bgm-toggle');
  if(el) el.muted = state._bgmMuted;
  if(btn) btn.classList.toggle('off', state._bgmMuted);
  if(!state._bgmMuted && el){ const p = el.play && el.play(); if(p && p.catch) p.catch(function(){}); }
}
function bgmStart(){
  const el = $('bgm');
  if(!el) return;
  el.addEventListener('ended', bgmNext);
  el.muted = state._bgmMuted;
  bgmUpdate();
  // 首次用户交互（点选开局/政令等）时若尚未播起来，补一次 play
  const kick = function(){ if(el.paused){ const p = el.play && el.play(); if(p && p.catch) p.catch(function(){}); } };
  document.addEventListener('pointerdown', kick, { once:true });
}
function refreshScene(){
  const gs = state.gs; const sc = document.getElementById('scene');
  if(!gs || !sc){ if(sc) sc.innerHTML=''; return; }
  // 新开档首次重绘摇一次种子，同局内每月重绘沿用同一种子，画面不跳变
  if(state.sceneSeed === undefined) state.sceneSeed = Math.random() * 100000;
  // 新版：背景层全量重绘 + 人物层 diff（保住 DOM，动画才连续）+ 挂 rAF 动画
  SceneRenderer.refreshScene(gs, { lastEventTitle: state.sceneEvent || '', seed: state.sceneSeed });
  if(SceneAnimator) SceneAnimator.rebuildRefs();
  bgmUpdate();   // 数值/阶段变化 → 同步 BGM（不打断当前曲）
}
function setEvent(t){
  const el = $('eventText');
  el.innerHTML = esc(t);
  // 事件文本全展开后量出实际高度，供预览区顶部跟随（测试环境无 offsetHeight 时跳过）
  if(document.documentElement && el.offsetHeight){
    document.documentElement.style.setProperty('--evh', el.offsetHeight + 'px');
  }
}
function setTip(t){ $('tip').textContent = t||''; }
function fmtEff(a){
  const p=[]; const ev=a.effects.values||{};
  for(const k of VALUE_KEYS_){ if(ev[k]) p.push(`${VALUE_NAMES[k]}${ev[k]>0?'+':''}${ev[k]}`); }
  if(a.setTaxRate) p.push(`税赋${a.setTaxRate>0?'+':''}${Math.round(a.setTaxRate*100)}%`);
  if(a.setMarketRate) p.push(`市集${a.setMarketRate>0?'+':''}${Math.round(a.setMarketRate*100)}%`);
  if(a.effects.personality?.x) p.push(`仁政${a.effects.personality.x>0?'+':''}${a.effects.personality.x}`);
  if(a.effects.personality?.y) p.push(`清廉${a.effects.personality.y>0?'+':''}${a.effects.personality.y}`);
  return p.join(' ');
}

// ===================== 存档 =====================
function saveGame(){
  if(!state.gs || state.gs.termEnded) return;
  localStorage.setItem(SAVE_KEY, JSON.stringify({
    state: state.gs.serialize(),
    currentEventId: state.curEv ? state.curEv.id : null,
    pendingAction: state.actPanel,
    origin: state.gs.origin, sceneSeed: state.sceneSeed, ts: Date.now(),
  }));
}
function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY); if(!raw) return null;
    const d = JSON.parse(raw);
    const st = GameState_.deserialize(d.state);
    return {...d, termEnded: st.termEnded, year: st.year, month: st.month};
  }catch(e){ return null; }
}

// ===================== 主流程 =====================
function newGame(origin){
  // 兼容测试/旧代码传入出身(jinshi/juren/juanguan)：映射到背景；合法背景直接透传
  const bg = (origin in BACKGROUNDS) ? origin : (LEGACY_ORIGIN_TO_BACKGROUND[origin] || 'wild');
  if(!state.introBg && typeof document !== 'undefined' && document.body && window.SceneRenderer && window.SceneRenderer.renderIntroScene){
    // 首次进入（非重开）：先播水墨开场动画，播完再真正开局
    hideStartPanel();
    state.introBg = bg;
    playIntro(bg);

  }
  hideStartPanel();
  state.gs = new GameState_(bg); state.demoDone=false; state.curEv=null;
  state.sceneEvent=null; state.sceneSeed=undefined;   // 新开档重新摇场景种子

// ===== 水墨古风开场：随机择地后全屏播放，播完自动进入政令界面 =====
const INTRO_LINES = {
  wild:   { title: '蛮荒未化之地', name: '青阳县 · 蛮荒',   sub: '四境未辟，捐官至此，草创维艰' },
  ruin:   { title: '战后破败之地', name: '青阳县 · 战后',   sub: '残垣犹在，捐官至此，百废待兴' },
  county: { title: '中规中矩县城', name: '青阳县 · 县城',   sub: '举人赴任，一县寻常，守成有方' },
  city:   { title: '繁华大都市',   name: '青阳县 · 都会',   sub: '进士及第，烟花十里，大展身手' },
};
function playIntro(bg){
  const p = $('intro'); if(!p) return;
  const L = INTRO_LINES[bg] || INTRO_LINES.wild;
  const poster = (INTRO_BG && INTRO_BG[bg]) ? INTRO_BG[bg] : null;
  p.innerHTML =
    (poster
      ? `<img class="intro-bg" alt="" src="${poster}">`
      : `<div class="intro-scene">${SceneRenderer.renderIntroScene(bg)}</div>`) +
    `<div class="intro-mask"></div>` +
    `<div class="intro-caption">大衍朝 · 青阳志 · 卷一</div>` +
    `<div class="intro-name">${L.name}</div>` +
    `<div class="intro-sub">${L.sub}</div>` +
    `<div class="intro-skip" id="introSkip" onclick="skipIntro()">轻点任意处 · 进入游戏 ▸</div>`;
  p.classList.add('on');
  $('introSkip') && ($('introSkip').style.display = 'block');
  p.onclick = function(){ if(p.classList.contains('on')) skipIntro(); };
  // 播完自动进入游戏（约 2.6s；被 skipIntro 抢先则直接无视）
  clearTimeout(state._introTimer);
  state._introTimer = setTimeout(function(){ if(state.introBg) finishIntro(); }, 2600);
}
function skipIntro(){ if(state.introBg) finishIntro(); }
function finishIntro(){
  clearTimeout(state._introTimer);
  const bg = state.introBg; if(!bg) return;
  state.introBg = null;
  const p = $('intro');
  if(p){
    // 渐变淡出：先加 .off 触发 opacity 过渡（保留 .on 让 display:block 直到动画播完），
    // 约 620ms 后再真正摘除海报层并清空，避免海报瞬间被划走的生硬切换。
    p.classList.add('off');
    setTimeout(function(){
      p.classList.remove('on');
      p.classList.remove('off');
      p.innerHTML = '';
    }, 620);
  }
  // 真正开局：延续 newGame 中断点之后的流程
  state.gs = new GameState_(bg); state.demoDone=false; state.curEv=null;
  state.sceneEvent=null; state.sceneSeed=undefined;
  refreshStatus(); nextTurn({recap:false});
}
function continueGame(save){
  hideStartPanel();
  state.gs = GameState_.deserialize(save.state);
  state.demoDone=false; state.curEv=null; state.actPanel=false;
  state.sceneSeed = (save.sceneSeed !== undefined) ? save.sceneSeed : undefined;   // 读档沿用原种子，无则重摇
  refreshStatus();
  if(save.currentEventId){
    const ev = state.sys.find(save.currentEventId);
    if(ev){ state.curEv=ev; showEvent(ev); return; }
  }
  if(save.pendingAction){ showActionPanel(); return; }
  nextTurn({recap:false});
}
function nextTurn(opts){
  opts = opts || {};
  const gs=state.gs; if(!gs || gs.termEnded) return;
  state.recapPrev = { ...gs.values };      // 结算前快照（月度变化）
  gs.monthlySettle(); refreshStatus();
  if(opts.recap === false){ showActionPanel(); return; }  // 新开档/读档首次不展示月结
  showMonthRecap();   // 月结：全屏展示治理后的场景
}
// ===== 月结全屏展示层 =====
// 每月结算后全屏展示动态场景（分层入场动画），右上角/任意点击开启下月
function showMonthRecap(){
  const gs=state.gs; if(!gs || gs.termEnded) return;
  // 摘要：本月数值增减（结算前快照 vs 当前）
  state.recapTitle = `${gs.year} 年 ${gs.month} 月 · 治理小成`;
  $('recapTitle').textContent = state.recapTitle;
  $('recapChanges').innerHTML = recapDiffHTML(state.recapPrev || {}, gs.values);
  const r = $('recap');
  state.recapT0 = (typeof performance!=='undefined' ? performance.now() : Date.now());  // 跳过闸门计时起点
  r.classList.add('on');
  $('scene').classList.add('on');   // 场景层提升到 UI 之上，全屏展示动态场景（清明上河图视角+火柴人）
  // 重绘场景（全屏展示时重新触发分层入场动画）
  refreshScene();
  setTip('');
}
function recapDiffHTML(prev, cur){
  const parts = [];
  VALUE_KEYS_.forEach(k=>{
    const d = Math.round(cur[k]) - Math.round(prev[k]);
    if(d!==0) parts.push(`<span>${VALUE_NAMES[k]||k} <b class="${d>0?'ch-up':'ch-down'}">${d>0?'+':''}${d}</b></span>`);
  });
  if(state.sceneEvent) parts.push(`<span>· 昨事：${esc(state.sceneEvent)}</span>`);
  return parts.length ? parts.join('　') : '<span>四方无事 · 岁月静好</span>';
}
// 跳过展示/动画，开启下月治理（右上角按钮或任意点击）
// 苏醒开场 2.4 秒内不可跳过（按钮与提示文案此时也不显示，见 CSS）
function skipRecap(){
  const r = $('recap'); if(!r.classList.contains('on')) return;
  const now = (typeof performance!=='undefined' ? performance.now() : Date.now());
  if(state.recapT0 && now - state.recapT0 < 2400) return;   // 时间闸门：只做时间戳比较，不新增定时器
  r.classList.remove('on');
  $('scene').classList.remove('on');
  if(window.SceneAnimator){ if(window.SceneAnimator.settle) window.SceneAnimator.settle(); window.SceneAnimator.stop(); }
  showActionPanel();
}
function showActionPanel(){
  state.actPanel = true; state.curEv = null;
  const gs = state.gs;
  const avail = state.as.available(gs);
  const pages = Math.max(1, Math.ceil(avail.length/6));
  if(state.page>=pages) state.page=pages-1;
  const slice = avail.slice(state.page*6, (state.page+1)*6);
  // 背景：当前治下场景全屏（界画风，随故事线×发展阶段×月份变化，不再单一）
  const sc = gs ? (SceneRenderer.renderDecreeBG
      ? SceneRenderer.renderDecreeBG(gs, { lastEventTitle: state.sceneEvent || '' })
      : SceneRenderer.renderScene(gs, { lastEventTitle: state.sceneEvent || '' })) : '';
  let h = `<div class="start-scene">${sc}</div>` +
    `<div class="start-scrim"></div>` +
    `<div class="act-card"><h2>第 ${gs.year} 年 ${gs.month} 月 · 政令</h2>`;
  h += `<h3>${pages>1 ? '施一政令安一方民 · 第 '+(state.page+1)+'/'+pages+' 页' : '施一政令，安一方民'}</h3>`;
  if(slice.length===0) h += '<h3>本月无可行政令</h3>';
  slice.forEach(a=>{
    h += `<button class="act-btn" onclick="pickAction('${a.id}')">` +
      `<span class="act-name">${esc(a.name)}<span class="act-eff">　${esc(fmtEff(a))}</span></span>` +
      (a.desc ? `<span class="act-desc">${esc(a.desc)}</span>` : '') +
      `</button>`;
  });
  if(pages>1){
    h += '<div class="pager">';
    if(state.page>0) h += `<button class="btn" onclick="actPage(-1)">◀ 上页</button>`;
    if(state.page<pages-1) h += `<button class="btn" onclick="actPage(1)">下页 ▶</button>`;
    h += '</div>';
  }
  h += `<button class="act-rest" onclick="pickAction(null)">留白休整（本月不施政令）</button></div>`;
  h += `<div class="act-foot">大人请定夺</div>`;
  const p = $('actionPanel');
  p.innerHTML = h;
  p.classList.add('on');
  hidePreview(); hideDecisionBar();
  setTip(''); saveGame();
}
function actPage(d){ state.page+=d; showActionPanel(); }
function pickAction(id){
  if(!state.gs || state.gs.termEnded) return;
  const p = $('actionPanel'); if(p) p.classList.remove('on');
  if(id){ const a=state.as.find(id); if(a) state.gs.applyAction(a); }
  state.actPanel=false; state.page=0; refreshStatus();
  afterAction();
}
function afterAction(){
  const gs=state.gs; if(!gs || gs.termEnded) return;
  const ev = state.sys.draw(gs);
  if(!ev){
    setEvent('本月无事，百姓安居。'); state.curEv=null;
    $('choices').innerHTML = '<button class="btn" onclick="advance()">迈入下月 ▶</button>';
    hidePreview(); setTip(''); return;
  }
  state.curEv = ev; gs.markTriggered(ev.id); showEvent(ev);
}
function showEvent(ev){
  state.sceneEvent = ev.title;
  state.selChoice = null;   // 尚未点选任何选项
  let msg = `【${ev.title}】`;
  if(ev.trigger?.yearTerm || ev.trigger?.month)
    msg += `\n限定：${ev.trigger.yearTerm??''}年 ${ev.trigger.month?ev.trigger.month.join('/')+'月':''}`;
  msg += `\n${ev.text}\n`;
  setEvent(msg);
  renderChoices();
  showPreview('<div class="pv-tag">预观 · 请点选一项</div><div class="pv-holder"><div class="pv-q">？</div><div class="pv-hint">你的决定将导致后续剧情的变化</div></div>');
  showDecisionBar();
  setTip('点选一项预观其果，再按继续定夺 ↓'); saveGame();
}
// 渲染选项按钮 + 底部"继续"按钮（未点选项时禁用）
function renderChoices(){
  const ev = state.curEv; if(!ev) return;
  const gs = state.gs;
  const hint = caseHintHTML(ev);
  $('choices').innerHTML =
    (hint ? hint : '') +
    ev.choices.map((c,i)=>{
      const blocked = choiceBlocked(ev, c);
      return rankBtnHTML(i, c.text, fmtChoice(c), gs, i===state.selChoice, blocked);
    }).join('') +
    `<button class="btn gold" id="confirmBtn" onclick="choose()"${state.selChoice==null?' disabled':''}>继续 ▶</button>`;
}
// 点击某选项：仅预览场景+高亮，不真正选择；点"继续"才确定
function selectChoice(i){
  const ev = state.curEv; if(!ev || !ev.choices[i]) return;
  if(choiceBlocked(ev, ev.choices[i])){ setTip('此策所需人力/财力不足，暂不可行'); return; }
  state.selChoice = i;
  renderChoices();
  previewChoice(i);
  setTip('已预观该策之果，点「继续」定夺 ↓');
}
// 确定选择当前高亮项（由"继续"按钮触发）；断案事件按误判规则结算
function choose(){
  if(!state.curEv || state.demoDone) return;
  const i = state.selChoice; if(i==null) return;
  const ev = state.curEv; const c = ev.choices[i]; if(!c) return;
  if(choiceBlocked(ev, c)) return;
  // 误判判定：不查案/草率结案的选项，按概率可能误判（后果替代正常效果）
  let misjudged = false;
  if(c.misjudge && Math.random() < (c.misjudge.chance||0)) misjudged = true;
  if(misjudged){
    state.gs.applyChoice({ effects: c.misjudge.effects });
    if(c.misjudge.resultText) setEvent(ev.text + '\n\n【后果】' + c.misjudge.resultText);
  } else {
    state.gs.applyChoice(c);
    if(c.resultText) setEvent(ev.text + '\n\n【后果】' + c.resultText);
  }
  // 刑名统计：凡断案类事件，计入年度考课刑名分
  if(isCaseEvent(ev)){
    state.gs.stats.casesTotal = (state.gs.stats.casesTotal||0) + 1;
    if(c.effects.caseSolved && !misjudged) state.gs.stats.casesSolved = (state.gs.stats.casesSolved||0) + 1;
  }
  if(c.chain) state.gs.enqueueChain(c.chain);
  refreshStatus();
  hidePreview();
  hideDecisionBar();
  $('choices').innerHTML='';
  setTimeout(advance, 350);
}
// 中间预览区显隐：仅事件选择时显示，其余场景隐藏（保持原有排版）
function showPreview(html){ const p=$('preview'); if(!p) return; p.style.display='block'; p.innerHTML=html; }
function hidePreview(){ const p=$('preview'); if(!p) return; p.style.display='none'; p.innerHTML=''; }
// 选项效果摘要（供按钮第二行展示）
function fmtChoice(c){
  const p=[]; const ev=c.effects.values||{};
  for(const k of VALUE_KEYS_){ if(ev[k]) p.push(`${VALUE_NAMES[k]}${ev[k]>0?'+':''}${ev[k]}`); }
  if(c.effects.personality?.x) p.push(`仁政${c.effects.personality.x>0?'+':''}${c.effects.personality.x}`);
  if(c.effects.personality?.y) p.push(`清廉${c.effects.personality.y>0?'+':''}${c.effects.personality.y}`);
  if(c.misjudge) p.push(`⚠恐误判`);
  return p.join('　');
}
// 某选项当前是否可选（断案事件：查案需人力财力，不足则置灰禁用）
function choiceBlocked(ev, c){
  const gs = state.gs; if(!gs) return true;
  const need = c.need || {};
  if(need.values){
    for(const k of Object.keys(need.values)){
      if(gs.values[k] < (need.values[k]||0)) return true;
    }
  }
  if(need.personality?.x !== undefined){
    const p = need.personality.x;
    if(p >= 0 && gs.personality.x < p) return true;
    if(p < 0 && gs.personality.x > p) return true;
  }
  if(need.personality?.y !== undefined){
    const p = need.personality.y;
    if(p >= 0 && gs.personality.y < p) return true;
    if(p < 0 && gs.personality.y > p) return true;
  }
  return false;
}
// 是否为「刑名」类事件（计入年度考课刑名分）
function isCaseEvent(ev){
  return !!(ev && ev.type === 'justice');
}
// 断案提示条：查案需人力财力，不查恐误判（仅当事件确有「查案需资源/误判风险」机制时显示）
function caseHintHTML(ev){
  if(!ev || ev.type !== 'justice') return '';
  if(!ev.choices.some(c => c.misjudge || c.need)) return '';
  return '<div class="case-hint">此案若要查个水落石出，需人力、耗钱财；若草草了断，恐有误判之虞——是查是拖，大人三思。</div>';
}
// 场景预览：模拟"选择该选项后"的数值 → 渲染对应场景到中间大块
function previewChoice(i){
  const gs = state.gs, ev = state.curEv;
  if(!gs || !ev) return;
  const c = ev.choices[i]; if(!c) return;
  const tag = `<div class="pv-tag">预观 · 择「${esc(c.text)}」</div>`;
  // 优先显示 事件选项场景图（E01_A … E20_C，来自 outputs/imagegen 成品）
  const imgKey = ev.id + '_' + c.id;   // 如 E01 + A → "E01_A"
  const img = PREVIEW_IMGS[imgKey];
  if(img){
    showPreview(tag + `<img class="pv-img" src="${img}" alt="">`);
    return;
  }
  // 查不到对应图 → 回退程序化 SVG 动作场景
  const sim = {
    values: { ...gs.values },
    personality: { ...gs.personality },
    month: gs.month, year: gs.year, taxRate: gs.taxRate,
  };
  const eff = c.effects.values||{};
  for(const k of Object.keys(eff)) sim.values[k] = Math.max(0, Math.min(100, sim.values[k] + (eff[k]||0)));
  const svg = SceneRenderer.renderChoiceScene(ev, c, sim);
  showPreview(tag + svg);
}
function advance(){
  const gs=state.gs; if(!gs || state.demoDone) return;
  const exam = gs.advanceMonth();
  if(exam){
    if(gs.termEnded){
      const end = judgeEnding_(gs);
      localStorage.removeItem(SAVE_KEY);
      state.demoDone=true; state.curEv=null;
      refreshStatus();
      setEvent(`【结局】${end.ending}\n\n${end.desc}\n\n任期档案：\n` +
        gs.examHistory.map(h=>`${h.year}年 考课 ${h.grade}（${h.score}分）`).join('\n') +
        `\n\n${BGM_CREDITS_}`);
      $('choices').innerHTML = '<button class="btn" onclick="location.reload()">重新开堂 ▶</button>';
      setTip('任期已满 · 新晋接印');
      hidePreview();
      return;
    }
    setEvent(`——第 ${gs.year} 年考课：${exam.grade}（${exam.score} 分）——\n\n`);
  }
  state.curEv=null;
  nextTurn();
}
function showStartPanel(){
  const p = $('startPanel'); if(!p) return;
  // 背景：府衙门楼位图（CSS background 已内联 START_BG），不再叠加 SVG 场景
  p.innerHTML =
    `<div class="start-scrim"></div>` +
    `<div class="start-card" id="startCard"></div>` +
    `<div class="start-foot">青阳县衙 · 恭候明公上任</div>`;
  p.classList.add('on');
  renderStartCard();
}
function renderStartCard(){
  const save = loadSave();
  const card = $('startCard'); if(!card) return;
  let h = '<h2>青阳县令上任</h2><h3>大衍朝 · 治县三载，考课定前程</h3>';
  if(save && !save.termEnded)
    h += `<button class="btn gold" onclick="continueGame(loadSave())">继续上任（${bgInfo(save.origin).name} · 第${save.year}年${save.month}月）</button>`;
  h += '<button class="btn" onclick="newGame(rollBackground())">赴任（随机择一地）</button>';
  h += '<div class="start-note">蛮荒 / 战后 / 县城 / 都市 四地随机而定，出身随之而定</div>';
  h += '<div class="start-note">背景音乐 Kevin MacLeod (incompetech.com) · CC BY 4.0</div>';
  card.innerHTML = h;
}
function hideStartPanel(){
  const p = $('startPanel'); if(!p) return;
  p.classList.remove('on'); p.innerHTML='';
}
function showStart(){
  $('eventText').innerHTML = '';
  $('choices').innerHTML=''; hidePreview(); hideDecisionBar(); setTip('');
  showStartPanel();
}
// ===================== 启动 =====================
$('recap').addEventListener('click', skipRecap);
state.sys = EventSystem_.load(JSON.stringify(EVENTS_DATA));
state.as = ActionSystem_.load(JSON.stringify(ACTIONS_DATA));
bgmStart();   // 挂 BGM：阶段切换 + 一首播完切下一首 + 首次点击补播
showStart();
</script>
</body>
</html>
