// ============ 常量 ============
const VALUE_KEYS             = ['tresury', 'granary', 'people', 'security', 'reputation', 'population'];
const VALUE_MAX = 100;
const VALUE_MIN = 0;
const PERSONALITY_MAX = 100;
const PERSONALITY_MIN = -100;
const TERM_YEARS = 3;
const MONTHS_PER_YEAR = 12;

const INITIAL_VALUES                         = {
  jinshi:   { tresury: 55, granary: 50, people: 50, security: 60, reputation: 60, population: 50 },
  juren:    { tresury: 45, granary: 60, people: 65, security: 55, reputation: 45, population: 55 },
  juanguan: { tresury: 70, granary: 40, people: 40, security: 50, reputation: 35, population: 45 },
};
const INITIAL_PERSONALITY                              = {
  jinshi:   { x: 10, y: 15 },
  juren:    { x: 15, y: 5 },
  juanguan: { x: -5, y: -20 },
};

// ============ 工具 ============
function clamp(v        , min        , max        )         {
  return Math.max(min, Math.min(max, Math.round(v)));
}
function clampValues(values        )         {
  const out = {}          ;
  for (const k of VALUE_KEYS) out[k] = clamp(values[k], VALUE_MIN, VALUE_MAX);
  return out;
}

/** 浮点 clamp（不取整），用于 taxRate/marketRate 等连续系数 */
function clampF(v        , min        , max        )         {
  return Math.max(min, Math.min(max, v));
}
function clampPersonality(p             )              {
  return { x: clamp(p.x, PERSONALITY_MIN, PERSONALITY_MAX), y: clamp(p.y, PERSONALITY_MIN, PERSONALITY_MAX) };
}

// ============ 游戏状态 ============
class GameState {
  values        ;
  personality             ;
  year        ;          // 1~3
  month        ;         // 1~12
  origin        ;
  taxRate = 1.0;         // 税赋系数
  marketRate = 1.0;      // 市集系数
  flags              = new Set();
  triggered              = new Set();
  pendingChains           = [];
  actionCooldowns                         = {};  // 政令冷却（月），每月递减
  stats           ;
  examHistory                                                   = [];
  eventLog           = [];

  constructor(origin         = 'jinshi') {
    this.origin = origin;
    this.values = { ...INITIAL_VALUES[origin] };
    this.personality = { ...INITIAL_PERSONALITY[origin] };
    this.year = 1;
    this.month = 1;
    this.stats = { populationStartOfYear: this.values.population, populationNetChange: 0, taxCollected: 0, taxTarget: 0, casesSolved: 0, casesTotal: 0 };
    this.stats.taxTarget = this.computeMonthlyIncome() * MONTHS_PER_YEAR;
  }

  get phase()                                            {
    if (this.month <= 3) return 'spring';
    if (this.month <= 6) return 'summer';
    if (this.month <= 9) return 'autumn';
    return 'winter';
  }

  // —— 月度收入 ——
  computeMonthlyIncome()         {
    const tianfu = this.values.population * 0.9 * this.taxRate;
    const shangshui = this.values.security * 0.35 * this.marketRate;
    return Math.round(tianfu + shangshui);
  }

  // —— 月度结算（v0 公式）——
  monthlySettle()       {
    const income = this.computeMonthlyIncome();
    const expense = 25 + 5; // 俸禄 25 + 仓储维护 5（v0 无工程摊销/赈济）
    const surplus = income - expense;
    this.values.tresury = clamp(this.values.tresury + Math.round(surplus * 0.35), VALUE_MIN, VALUE_MAX);
    if (this.values.population >= 55) this.values.granary = clamp(this.values.granary + 1, VALUE_MIN, VALUE_MAX);
    if (this.taxRate >= 1.1) this.values.people = clamp(this.values.people - 2, VALUE_MIN, VALUE_MAX);
    else this.values.people = clamp(this.values.people + 0.5, VALUE_MIN, VALUE_MAX);
    const popDelta = this.values.people >= 60 ? 0.4 : this.values.people <= 30 ? -0.6 : 0;
    this.values.population = clamp(this.values.population + popDelta, VALUE_MIN, VALUE_MAX);
    this.stats.taxCollected += income;
    this.stats.populationNetChange = this.values.population - this.stats.populationStartOfYear;
  }

  // —— 事件结算 ——
  applyChoice(choice        )       {
    const e = choice.effects;
    for (const k of Object.keys(e.values)              ) {
      this.values[k] = clamp(this.values[k] + (e.values[k] ?? 0), VALUE_MIN, VALUE_MAX);
    }
    this.personality = clampPersonality({
      x: this.personality.x + (e.personality.x ?? 0),
      y: this.personality.y + (e.personality.y ?? 0),
    });
    if (e.flag) for (const f of e.flag) this.flags.add(f);
  }

  markTriggered(eventId        )       {
    this.triggered.add(eventId);
  }

  /** 政令冷却逐月递减 */
  tickActionCooldowns()       {
    const out                         = {};
    for (const k of Object.keys(this.actionCooldowns)) {
      const v = this.actionCooldowns[k] - 1;
      if (v > 0) out[k] = v;
    }
    this.actionCooldowns = out;
  }

  /** 应用一个政令（数值/人格/flag/taxRate/marketRate/冷却） */
  applyAction(a            )       {
    const e = a.effects;
    for (const k of Object.keys(e.values)              ) {
      this.values[k] = clamp(this.values[k] + (e.values[k] ?? 0), VALUE_MIN, VALUE_MAX);
    }
    this.personality = clampPersonality({
      x: this.personality.x + (e.personality?.x ?? 0),
      y: this.personality.y + (e.personality?.y ?? 0),
    });
    if (e.flag) for (const f of e.flag) this.flags.add(f);
    if (a.setTaxRate) {
      this.taxRate = clampF(this.taxRate + a.setTaxRate, 0.6, 1.6);
    }
    if (a.setMarketRate) {
      this.marketRate = clampF(this.marketRate + a.setMarketRate, 0.6, 1.6);
    }
    if (a.cooldown) this.actionCooldowns[a.id] = a.cooldown;
  }

  enqueueChain(chain                      )       {
    if (chain) for (const c of chain) if (!this.pendingChains.includes(c)) this.pendingChains.push(c);
  }

  // —— 季度人格回摆（向 0 收敛）——
  quarterlyPersonalityDrift()       {
    const drift = (v        ) => (v > 0 ? Math.max(0, v - 2) : Math.min(0, v + 2));
    this.personality = clampPersonality({ x: drift(this.personality.x), y: drift(this.personality.y) });
  }

  // —— 年度考课（v0 公式）——
  evaluateExam()             {
    const popScore = clamp(this.stats.populationNetChange * 1.5, 0, 30);
    const ratio = this.stats.taxTarget > 0 ? this.stats.taxCollected / this.stats.taxTarget : 0;
    const taxScore = clamp(Math.round(ratio * 30), 0, 30);
    const secScore = clamp(this.values.security >= 60 ? 20 : this.values.security - 40, 0, 20);
    const caseScore = this.stats.casesTotal > 0 ? Math.round((this.stats.casesSolved / this.stats.casesTotal) * 10) : 5;
    const respScore = 6; // v0 默认"良"；负面应对在事件数据中用 flag 修正
    const score = popScore + taxScore + secScore + caseScore + respScore;
    const grade = this.gradeFor(score);
    return { score, grade, breakdown: { population: popScore, tax: taxScore, security: secScore, cases: caseScore, response: respScore } };
  }

  gradeFor(score        )         {
    if (score >= 90) return '上上';
    if (score >= 75) return '上';
    if (score >= 60) return '中上';
    if (score >= 45) return '中';
    if (score >= 30) return '中下';
    return '下';
  }

  advanceMonth()                    {
    this.month += 1;
    this.tickActionCooldowns();
    if (this.month > MONTHS_PER_YEAR) {
      this.month = 1;
      // 先结算刚刚结束的这一年的考课
      const exam = this.evaluateExam();
      this.examHistory.push({ year: this.year, score: exam.score, grade: exam.grade });
      this.year += 1;
      if (this.year > TERM_YEARS) return exam; // 任期结束（第 3 年考课已结算入档，仍需返回给上层展示）
      // 重置年度统计
      this.stats = { populationStartOfYear: this.values.population, populationNetChange: 0, taxCollected: 0, taxTarget: this.computeMonthlyIncome() * MONTHS_PER_YEAR, casesSolved: 0, casesTotal: 0 };
      return exam;
    }
    if (this.month % 3 === 1) this.quarterlyPersonalityDrift();
    return null;
  }

  /** 任期是否结束（3 年考课全部完成） */
  get termEnded()          {
    return this.year > TERM_YEARS && this.examHistory.length >= TERM_YEARS;
  }

  // —— 存档 ——
  serialize()         {
    return JSON.stringify({
      values: this.values, personality: this.personality, year: this.year, month: this.month,
      origin: this.origin, taxRate: this.taxRate, marketRate: this.marketRate,
      flags: [...this.flags], triggered: [...this.triggered], pendingChains: this.pendingChains,
      actionCooldowns: this.actionCooldowns,
      stats: this.stats, examHistory: this.examHistory,
    });
  }

  static deserialize(raw        )            {
    const s = JSON.parse(raw);
    const gs = new GameState(s.origin);
    gs.values = s.values; gs.personality = s.personality; gs.year = s.year; gs.month = s.month;
    gs.taxRate = s.taxRate; gs.marketRate = s.marketRate;
    gs.flags = new Set(s.flags); gs.triggered = new Set(s.triggered); gs.pendingChains = s.pendingChains;
    gs.actionCooldowns = s.actionCooldowns ?? {};
    gs.stats = s.stats; gs.examHistory = s.examHistory;
    return gs;
  }
}

// ============ 事件系统 ============
class EventSystem {
          events              = [];

  static load(raw        )              {
    const es = new EventSystem();
    es.events = JSON.parse(raw).events               ;
    return es;
  }

  get all()              { return this.events; }

  find(id        )                        { return this.events.find(e => e.id === id); }

  /** 判断事件当前是否可触发（连锁事件同样必须满足触发条件，只是抽取时优先） */
  eligible(ev           , state           )          {
    if (ev.once && state.triggered.has(ev.id)) return false;
    const t = ev.trigger ?? {};
    if (t.month && !t.month.includes(state.month)) return false;
    if (t.yearTerm && t.yearTerm !== state.year) return false;
    if (ev.phase && ev.phase !== 'any') {
      if (ev.phase === 'fixed_december' && state.month !== 12) return false;
      if (ev.phase !== 'fixed_december' && ev.phase !== state.phase) return false;
    }
    if (t.values?.min) {
      for (const k of Object.keys(t.values.min)              ) {
        if (state.values[k] < (t.values.min[k] ?? 0)) return false;
      }
    }
    if (t.values?.max) {
      for (const k of Object.keys(t.values.max)              ) {
        if (state.values[k] > (t.values.max[k] ?? 0)) return false;
      }
    }
    if (t.personality?.x !== undefined) {
      const p = t.personality.x;
      if (p >= 0 && state.personality.x < p) return false;
      if (p < 0 && state.personality.x > p) return false;
    }
    if (t.requireEvent && !state.triggered.has(t.requireEvent)) return false;
    if (t.excludeEvent && state.triggered.has(t.excludeEvent)) return false;
    if (t.flag && !state.flags.has(t.flag)) return false;
    return true;
  }

  /** 抽取一个可触发事件：优先必发队列（满足条件的连锁事件），否则加权随机；无则返回 null */
  draw(state           )                   {
    // 连锁事件满足条件时优先触发
    for (const cid of state.pendingChains) {
      const ev = this.find(cid);
      if (ev && this.eligible(ev, state)) {
        return ev;
      }
    }
    const pool = this.events.filter(e => this.eligible(e, state));
    if (pool.length === 0) return null;
    const total = pool.reduce((sum, e) => sum + e.weight, 0);
    let roll = Math.random() * total;
    for (const ev of pool) {
      roll -= ev.weight;
      if (roll <= 0) return ev;
    }
    return pool[pool.length - 1];
  }
}

// ============ 政令系统（月度主动行动） ============
class ActionSystem {
          actions               = [];

  static load(raw        )               {
    const as = new ActionSystem();
    as.actions = JSON.parse(raw).actions                ;
    return as;
  }

  get all()               { return this.actions; }

  find(id        )                         { return this.actions.find(a => a.id === id); }

  /** 政令当前是否可行 */
  eligible(a            , state           )          {
    if ((state.actionCooldowns[a.id] ?? 0) > 0) return false;
    const need = a.need ?? {};
    if (need.values) {
      for (const k of Object.keys(need.values)              ) {
        const min = need.values[k];
        if (min !== undefined && state.values[k] < min) return false;

function rankIndex(gs){

  let up = 0;
  for(const h of gs.examHistory){

  const col = rank.color;
  // 各品禽鸟简笔画（差异化身形）
  let b = '';
  switch(bird){
    case '鸂鶒': b = '<path d="M7,15 Q5,11 6,8 L4,7 Q2,5 4,4 L7,5 L8,4 Q9,2 10,4 L10,6 L13,7 Q14,8 13,9 L10,9 L10,12 Q9,14 7,15 Z" fill="#2f6a52"/>'; break; // 鸳鸯短小
    case '鹭鸶': b = '<path d="M6,16 L6,10 L5,7 Q4,5 6,4 L8,4 Q10,5 9,7 L8,10 L8,16 Z" fill="#e8e4d8"/><path d="M8,4 L10,2 M7,5 L9,3" stroke="#2e5f7a" stroke-width="1"/>'; break; // 白鹭纤长
    case '白鹇': b = '<path d="M7,15 Q6,11 6,8 L4,6 Q3,4 5,4 L8,5 L11,4 Q13,4 12,6 L10,8 L10,10 Q9,13 7,15 Z" fill="#e8e4d8"/><path d="M9,12 Q13,12 14,14 Q13,15 12,13" stroke="#4a6f9a" stroke-width="1" fill="none"/>'; break; // 白雉长尾
    case '云雁': b = '<path d="M6,14 Q5,10 6,7 L4,5 Q3,4 4,3 L6,4 L7,6 L8,5 Q9,4 10,5 L9,7 L10,10 Q9,13 6,14 Z" fill="#3a5a8f"/><path d="M4,4 Q2,2 1,3 M10,4 Q12,2 13,3" stroke="#3a5a8f" stroke-width="1"/>'; break; // 展翅雁
    case '孔雀': b = '<path d="M7,16 Q6,12 6,8 L8,6 Q10,5 10,7 L9,9 Q10,12 7,16 Z" fill="#2f6a52"/><path d="M10,8 Q15,7 15,10 Q15,12 12,11 Q14,13 11,12" stroke="#2f6a52" stroke-width="1.1" fill="none"/><circle cx="6" cy="5" r="1.6" fill="#7fbfbf"/>'; break; // 孔雀扇尾
    case '锦鸡': b = '<path d="M7,16 Q6,12 6,8 L4,6 Q3,4 5,4 L8,5 L11,4 Q13,4 12,6 L10,8 L9,12 Q8,14 7,16 Z" fill="#9a3a3a"/><path d="M10,8 Q14,9 15,12 Q14,13 13,11" stroke="#c8a860" stroke-width="1.2" fill="none"/>'; break; // 锦鸡金尾
    case '仙鹤': b = '<path d="M7,16 L7,9 L6,6 Q5,4 7,3 L9,3 Q11,4 10,6 L9,9 L9,16 Z" fill="#f2efe6"/><path d="M9,3 L11,1 M8,4 L10,2" stroke="#6a4020" stroke-width="1"/><circle cx="6.5" cy="3" r="1.1" fill="#b03434"/><path d="M8,9 L11,12 M7,10 L10,13" stroke="#3a2a1a" stroke-width="0.8"/>'; break; // 丹顶鹤
  }
  return `<svg viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
    <rect x="0.5" y="0.5" width="17" height="17" fill="${col}" opacity="0.25" stroke="#e8cf8a" stroke-width="0.8" rx="1"/>
    <path d="M1,3 Q3,1.5 5,3 M13,3 Q15,1.5 17,3 M1,15 Q3,16.5 5,15 M13,15 Q15,16.5 17,15" stroke="#e8cf8a" stroke-width="0.6" fill="none" opacity="0.7"/>
    ${b}
  </svg>`;
}
// 官服品级徽标（状态栏小圆章）
function rankPill(gs){
  const r = currentRank(gs);
  return `<span class="rank-pill" style="--rc:${r.color};--rc-deep:${r.deep}">${r.name} · ${r.bird}</span>`;
}
// 官服配色按钮：补子绣花 + 选项文本 + 效果预览；点击→预览场景，点"继续"→才确定选此项
function rankBtnHTML(i, text, eff, gs, sel){
  const r = currentRank(gs);
  return `<button class="rank-btn${sel?' sel':''}" style="--rc:${r.color};--rc-deep:${r.deep}" onclick="selectChoice(${i})">
    <span class="buzi">${buziSVG(r)}</span>
    <span class="buzi-text"><span class="t1">${esc(text)}</span><span class="t2">${esc(eff||'')}</span></span>
    <span class="buzi-eff">${esc(eff||'')}</span>
    <span class="buzi-rank">${r.bird}补 · ${r.robe}</span>
  </button>`;
}

// ===================== UI 辅助 =====================
const $ = id => document.getElementById(id);
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtValues(gs){
  return VALUE_KEYS_.map(k => esc(`${VALUE_NAMES[k]||k} ${Math.round(gs.values[k])}`)).join('　');
}
function refreshStatus(){
  const gs = state.gs; if(!gs){ $('statusBox').innerHTML=''; return; }
  // 官服主题同步：当前品级色驱动所有面板边框（随升迁换色，默认 p7 青绿）
  const r = currentRank(gs);
  if(document.documentElement){
    document.documentElement.style.setProperty('--frame', r.color);
    document.documentElement.style.setProperty('--frame-deep', r.deep);
  }
  const valsHtml = VALUE_KEYS_.map(k =>
    `<span>${esc(VALUE_NAMES[k]||k)} <b>${Math.round(gs.values[k])}</b></span>`).join('');
  $('statusBox').innerHTML = `<div class="idline"><b>${ORIGIN_NAMES[gs.origin]}出身</b> · 第 ${gs.year} 年 ${gs.month} 月${rankPill(gs)}</div>` +
    `<div class="vals">${valsHtml}</div>` +
    `<div class="meta-line">仁政 ${gs.personality.x}　清廉 ${gs.personality.y}　税赋 ${Math.round(gs.taxRate*100)}%</div>`;
  refreshScene();
}
// 背景场景联动：数值 + 最近事件 → 动态 SVG 场景
function refreshScene(){
  const gs = state.gs; const sc = document.getElementById('scene');
  if(!gs || !sc){ if(sc) sc.innerHTML=''; return; }
  // 新版：背景层全量重绘 + 人物层 diff（保住 DOM，动画才连续）+ 挂 rAF 动画
  SceneRenderer.refreshScene(gs, { lastEventTitle: state.sceneEvent || '' });
  if(SceneAnimator) SceneAnimator.rebuildRefs();
}
function setEvent(t){
  const el = $('eventText');
  el.innerHTML = esc(t);
  // 事件文本全展开后量出实际高度，供预览区顶部跟随（测试环境无 offsetHeight 时跳过）
  if(document.documentElement && el.offsetHeight){
    document.documentElement.style.setProperty('--evh', el.offsetHeight + 'px');
  }
}
function setTip(t){ $('tip').textContent = t||''; }
function fmtEff(a){
  const p=[]; const ev=a.effects.values||{};
  for(const k of VALUE_KEYS_){ if(ev[k]) p.push(`${VALUE_NAMES[k]}${ev[k]>0?'+':''}${ev[k]}`); }
  if(a.setTaxRate) p.push(`税赋${a.setTaxRate>0?'+':''}${Math.round(a.setTaxRate*100)}%`);
  if(a.setMarketRate) p.push(`市集${a.setMarketRate>0?'+':''}${Math.round(a.setMarketRate*100)}%`);
  if(a.effects.personality?.x) p.push(`仁政${a.effects.personality.x>0?'+':''}${a.effects.personality.x}`);
  if(a.effects.personality?.y) p.push(`清廉${a.effects.personality.y>0?'+':''}${a.effects.personality.y}`);
  return p.join(' ');
}

// ===================== 存档 =====================
function saveGame(){
  if(!state.gs || state.gs.termEnded) return;
  localStorage.setItem(SAVE_KEY, JSON.stringify({
    state: state.gs.serialize(),
    currentEventId: state.curEv ? state.curEv.id : null,
    pendingAction: state.actPanel,
    origin: state.gs.origin, ts: Date.now(),
  }));
}
function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY); if(!raw) return null;
    const d = JSON.parse(raw);
    const st = GameState_.deserialize(d.state);
    return {...d, termEnded: st.termEnded, year: st.year, month: st.month};
  }catch(e){ return null; }
}

// ===================== 主流程 =====================
function newGame(origin){
  hideStartPanel();
  state.gs = new GameState_(origin); state.demoDone=false; state.curEv=null;
  state.sceneEvent=null;
  refreshStatus(); nextTurn({recap:false});
}
function continueGame(save){
  hideStartPanel();
  state.gs = GameState_.deserialize(save.state);
  state.demoDone=false; state.curEv=null; state.actPanel=false;
  refreshStatus();
  if(save.currentEventId){
    const ev = state.sys.find(save.currentEventId);
    if(ev){ state.curEv=ev; showEvent(ev); return; }
  }
  if(save.pendingAction){ showActionPanel(); return; }
  nextTurn({recap:false});
}
function nextTurn(opts){
  opts = opts || {};
  const gs=state.gs; if(!gs || gs.termEnded) return;
  state.recapPrev = { ...gs.values };      // 结算前快照（月度变化）
  gs.monthlySettle(); refreshStatus();
  if(opts.recap === false){ showActionPanel(); return; }  // 新开档/读档首次不展示月结
  showMonthRecap();   // 月结：全屏展示治理后的场景
}
// ===== 月结全屏展示层 =====
// 每月结算后全屏展示动态场景（分层入场动画），右上角/任意点击开启下月
function showMonthRecap(){
  const gs=state.gs; if(!gs || gs.termEnded) return;
  // 摘要：本月数值增减（结算前快照 vs 当前）
  state.recapTitle = `${gs.year} 年 ${gs.month} 月 · 治理小成`;
  $('recapTitle').textContent = state.recapTitle;
  $('recapChanges').innerHTML = recapDiffHTML(state.recapPrev || {}, gs.values);
  const r = $('recap');
  state.recapT0 = (typeof performance!=='undefined' ? performance.now() : Date.now());  // 跳过闸门计时起点
  r.classList.add('on');
  $('scene').classList.add('on');   // 场景层提升到 UI 之上，全屏展示动态场景（清明上河图视角+火柴人）
  // 重绘场景（全屏展示时重新触发分层入场动画）
  refreshScene();
  setTip('');
}
function recapDiffHTML(prev, cur){
  const parts = [];
  VALUE_KEYS_.forEach(k=>{
    const d = Math.round(cur[k]) - Math.round(prev[k]);
    if(d!==0) parts.push(`<span>${VALUE_NAMES[k]||k} <b class="${d>0?'ch-up':'ch-down'}">${d>0?'+':''}${d}</b></span>`);
  });
  if(state.sceneEvent) parts.push(`<span>· 昨事：${esc(state.sceneEvent)}</span>`);
  return parts.length ? parts.join('　') : '<span>四方无事 · 岁月静好</span>';
}
// 跳过展示/动画，开启下月治理（右上角按钮或任意点击）
// 苏醒开场 2.4 秒内不可跳过（按钮与提示文案此时也不显示，见 CSS）
function skipRecap(){
  const r = $('recap'); if(!r.classList.contains('on')) return;
  const now = (typeof performance!=='undefined' ? performance.now() : Date.now());
  if(state.recapT0 && now - state.recapT0 < 2400) return;   // 时间闸门：只做时间戳比较，不新增定时器
  r.classList.remove('on');
  $('scene').classList.remove('on');
  if(window.SceneAnimator){ if(window.SceneAnimator.settle) window.SceneAnimator.settle(); window.SceneAnimator.stop(); }
  showActionPanel();
}
function showActionPanel(){
  state.actPanel = true; state.curEv = null;
  const gs = state.gs;
  const avail = state.as.available(gs);
  const pages = Math.max(1, Math.ceil(avail.length/6));
  if(state.page>=pages) state.page=pages-1;
  const slice = avail.slice(state.page*6, (state.page+1)*6);
  // 背景：当前治下场景全屏（与开局页同风格）
  const sc = gs ? SceneRenderer.renderScene(gs, { lastEventTitle: state.sceneEvent || '' }) : '';
  let h = `<div class="start-scene">${sc}</div>` +
    `<div class="start-scrim"></div>` +
    `<div class="act-card"><h2>第 ${gs.year} 年 ${gs.month} 月 · 政令</h2>`;
  h += `<h3>${pages>1 ? '施一政令安一方民 · 第 '+(state.page+1)+'/'+pages+' 页' : '施一政令，安一方民'}</h3>`;
  if(slice.length===0) h += '<h3>本月无可行政令</h3>';
  slice.forEach(a=>{
    h += `<button class="act-btn" onclick="pickAction('${a.id}')">` +
      `<span class="act-name">${esc(a.name)}<span class="act-eff">　${esc(fmtEff(a))}</span></span>` +
      (a.desc ? `<span class="act-desc">${esc(a.desc)}</span>` : '') +
      `</button>`;
  });
  if(pages>1){
    h += '<div class="pager">';
    if(state.page>0) h += `<button class="btn" onclick="actPage(-1)">◀ 上页</button>`;
    if(state.page<pages-1) h += `<button class="btn" onclick="actPage(1)">下页 ▶</button>`;
    h += '</div>';
  }
  h += `<button class="act-rest" onclick="pickAction(null)">留白休整（本月不施政令）</button></div>`;
  h += `<div class="act-foot">大人请定夺</div>`;
  const p = $('actionPanel');
  p.innerHTML = h;
  p.classList.add('on');
  hidePreview();
  setTip(''); saveGame();
}
function actPage(d){ state.page+=d; showActionPanel(); }
function pickAction(id){
  if(!state.gs || state.gs.termEnded) return;
  const p = $('actionPanel'); if(p) p.classList.remove('on');
  if(id){ const a=state.as.find(id); if(a) state.gs.applyAction(a); }
  state.actPanel=false; state.page=0; refreshStatus();
  afterAction();
}
function afterAction(){
  const gs=state.gs; if(!gs || gs.termEnded) return;
  const ev = state.sys.draw(gs);
  if(!ev){
    setEvent('本月无事，百姓安居。'); state.curEv=null;
    $('choices').innerHTML = '<button class="btn" onclick="advance()">迈入下月 ▶</button>';
    hidePreview(); setTip(''); return;
  }
  state.curEv = ev; gs.markTriggered(ev.id); showEvent(ev);
}
function showEvent(ev){
  state.sceneEvent = ev.title;
  state.selChoice = null;   // 尚未点选任何选项
  let msg = `【${ev.title}】`;
  if(ev.trigger?.yearTerm || ev.trigger?.month)
    msg += `\n限定：${ev.trigger.yearTerm??''}年 ${ev.trigger.month?ev.trigger.month.join('/')+'月':''}`;
  msg += `\n${ev.text}\n`;
  setEvent(msg);
  renderChoices();
  showPreview('<div class="pv-tag">预观 · 请点选一项</div>');
  setTip('点选一项预观其果，再按继续定夺 ↓'); saveGame();
}
// 渲染选项按钮 + 底部"继续"按钮（未点选项时禁用）
function renderChoices(){
  const ev = state.curEv; if(!ev) return;
  const gs = state.gs;
  $('choices').innerHTML =
    ev.choices.map((c,i)=>rankBtnHTML(i, c.text, fmtChoice(c), gs, i===state.selChoice)).join('') +
    `<button class="btn gold" id="confirmBtn" onclick="choose()"${state.selChoice==null?' disabled':''}>继续 ▶</button>`;
}
// 点击某选项：仅预览场景+高亮，不真正选择；点"继续"才确定
function selectChoice(i){
  const ev = state.curEv; if(!ev || !ev.choices[i]) return;
  state.selChoice = i;
  renderChoices();
  previewChoice(i);
  setTip('已预观该策之果，点「继续」定夺 ↓');
}
// 确定选择当前高亮项（由"继续"按钮触发）
function choose(){
  if(!state.curEv || state.demoDone) return;
  const i = state.selChoice; if(i==null) return;
  const ev = state.curEv; const c = ev.choices[i]; if(!c) return;
  state.gs.applyChoice(c);
  if(c.resultText) setEvent(ev.text + '\n\n【后果】' + c.resultText);
  if(c.chain) state.gs.enqueueChain(c.chain);
  refreshStatus();
  hidePreview();
  $('choices').innerHTML='';
  setTimeout(advance, 350);
}
// 中间预览区显隐：仅事件选择时显示，其余场景隐藏（保持原有排版）
function showPreview(html){ const p=$('preview'); if(!p) return; p.style.display='block'; p.innerHTML=html; }
function hidePreview(){ const p=$('preview'); if(!p) return; p.style.display='none'; p.innerHTML=''; }
// 选项效果摘要（供按钮第二行展示）
function fmtChoice(c){
  const p=[]; const ev=c.effects.values||{};
  for(const k of VALUE_KEYS_){ if(ev[k]) p.push(`${VALUE_NAMES[k]}${ev[k]>0?'+':''}${ev[k]}`); }
  if(c.effects.personality?.x) p.push(`仁政${c.effects.personality.x>0?'+':''}${c.effects.personality.x}`);
  if(c.effects.personality?.y) p.push(`清廉${c.effects.personality.y>0?'+':''}${c.effects.personality.y}`);
  return p.join('　');
}
// 场景预览：模拟"选择该选项后"的数值 → 渲染对应场景到中间大块
function previewChoice(i){
  const gs = state.gs, ev = state.curEv;
  if(!gs || !ev) return;
  const c = ev.choices[i]; if(!c) return;
  const tag = `<div class="pv-tag">预观 · 择「${esc(c.text)}」</div>`;
  // 优先显示 事件选项场景图（E01_A … E20_C，来自 outputs/imagegen 成品）
  const imgKey = ev.id + '_' + c.id;   // 如 E01 + A → "E01_A"
  const img = PREVIEW_IMGS[imgKey];
  if(img){
    showPreview(tag + `<img class="pv-img" src="${img}" alt="">`);
    return;
  }
  // 查不到对应图 → 回退程序化 SVG 动作场景
  const sim = {
    values: { ...gs.values },
    personality: { ...gs.personality },
    month: gs.month, year: gs.year, taxRate: gs.taxRate,
  };
  const eff = c.effects.values||{};
  for(const k of Object.keys(eff)) sim.values[k] = Math.max(0, Math.min(100, sim.values[k] + (eff[k]||0)));
  const svg = SceneRenderer.renderChoiceScene(ev, c, sim);
  showPreview(tag + svg);
}
function advance(){
  const gs=state.gs; if(!gs || state.demoDone) return;
  const exam = gs.advanceMonth();
  if(exam){
    if(gs.termEnded){
      const end = judgeEnding_(gs);
      localStorage.removeItem(SAVE_KEY);
      state.demoDone=true; state.curEv=null;
      refreshStatus();
      setEvent(`【结局】${end.ending}\n\n${end.desc}\n\n任期档案：\n` +
        gs.examHistory.map(h=>`${h.year}年 考课 ${h.grade}（${h.score}分）`).join('\n'));
      $('choices').innerHTML = '<button class="btn" onclick="location.reload()">重新开堂 ▶</button>';
      setTip('任期已满 · 新晋接印');
      hidePreview();
      return;
    }
    setEvent(`——第 ${gs.year} 年考课：${exam.grade}（${exam.score} 分）——\n\n`);
  }
  state.curEv=null;
  nextTurn();
}
function showStartPanel(){
  const p = $('startPanel'); if(!p) return;
  // 背景：府衙门楼位图（CSS background 已内联 START_BG），不再叠加 SVG 场景
  p.innerHTML =
    `<div class="start-scrim"></div>` +
    `<div class="start-card" id="startCard"></div>` +
    `<div class="start-foot">青阳县衙 · 恭候明公上任</div>`;
  p.classList.add('on');
  renderStartCard();
}
function renderStartCard(){
  const save = loadSave();
  const card = $('startCard'); if(!card) return;
  let h = '<h2>青阳县令上任</h2><h3>大衍朝 · 治县三载，考课定前程</h3>';
  if(save && !save.termEnded)
    h += `<button class="btn gold" onclick="continueGame(loadSave())">继续上任（${ORIGIN_NAMES[save.origin]} · 第${save.year}年${save.month}月）</button>`;
  [['jinshi','进士出身　银库55 民心50 官声60'],
   ['juren','举人出身　银库45 民心65 官声45'],
   ['juanguan','捐官出身　银库70 民心40 官声35']].forEach(([o,t])=>{
    h += `<button class="btn" onclick="newGame('${o}')">${t}</button>`;
  });
  if(save) h += '<div class="start-note">选择出身将覆盖旧存档</div>';
  card.innerHTML = h;
}
function hideStartPanel(){
  const p = $('startPanel'); if(!p) return;
  p.classList.remove('on'); p.innerHTML='';
}
function showStart(){
  $('eventText').innerHTML = '';
  $('choices').innerHTML=''; hidePreview(); setTip('');
  showStartPanel();
}
// ===================== 启动 =====================
$('recap').addEventListener('click', skipRecap);
state.sys = EventSystem_.load(JSON.stringify(EVENTS_DATA));
state.as = ActionSystem_.load(JSON.stringify(ACTIONS_DATA));
showStart();
</script>
