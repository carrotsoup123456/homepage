<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/homepage/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- 基础信息：标题与描述由 src/data/meta.js 在切换页面时更新，这里是首屏与分享抓取的默认值 -->
    <title>刘博康 – 个人主页</title>
    <meta name="author" content="刘博康" />
    <meta
      name="description"
      content="刘博康的个人主页 · 计算机科学与技术 · 项目、知识库与联系方式"
    />
    <link rel="canonical" href="https://carrotsoup123456.github.io/homepage/" />

    <!-- 首帧防闪烁：在 Vue 挂载前就按「手动偏好 > 系统深浅色」定好主题。
         只写 dataset，不写 localStorage——写偏好是用户手动切换时才做的事。
         所有浏览器都支持 matchMedia；极端隐私模式 localStorage 抛错会被 try 兜住。 -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('homepage-theme')
          if (!t) {
            t =
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          }
          document.documentElement.dataset.theme = t
        } catch (e) {}
      })()
    </script>

    <!-- 首屏关键图提前取：hero 是 CSS 背景图，浏览器要等 CSSOM 建完才发现它，
         preload 让它与 CSS 并行下载；avatar 是 LCP 人像 -->
    <link rel="preload" as="image" href="/homepage/art/hero-forest.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/homepage/avatar.webp" fetchpriority="high" />

    <!-- 社交分享卡片：微信 / QQ / Facebook / X 读的是这些标签。
         注意：不执行 JavaScript 的抓取器只会看到这里的静态值（页面级动态值只对执行 JS 的抓取器生效）。 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="刘博康的个人主页" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="刘博康 – 个人主页" />
    <meta
      property="og:description"
      content="刘博康的个人主页 · 计算机科学与技术 · 项目、知识库与联系方式"
    />
    <meta property="og:url" content="https://carrotsoup123456.github.io/homepage/" />
    <meta property="og:image" content="https://carrotsoup123456.github.io/homepage/card.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="刘博康" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="刘博康 – 个人主页" />
    <meta
      name="twitter:description"
      content="刘博康的个人主页 · 计算机科学与技术 · 项目、知识库与联系方式"
    />
    <meta name="twitter:image" content="https://carrotsoup123456.github.io/homepage/card.webp" />
    <script type="module" crossorigin src="/homepage/assets/index-C0fKWK6W.js"></script>
    <link rel="stylesheet" crossorigin href="/homepage/assets/index-BTMw6tbz.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
