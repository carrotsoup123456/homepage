<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>连接到 carrot…</title>
<!-- carrot 手机版·永久入口页（跳板）：
     打开后自动跳转到你 Mac 的当前隧道地址。
     隧道地址变化时由 Mac 上的 watcher 自动更新本页并重推（carrot-tunnel-watch）。
     当前隧道：https://happens-morgan-skirt-latex.trycloudflare.com -->
<meta http-equiv="refresh" content="1;url=https://happens-morgan-skirt-latex.trycloudflare.com">
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
       background:#262a33;color:#e8e6e3;font:15px/1.8 -apple-system,"PingFang SC",sans-serif;gap:14px}
  .spin{width:34px;height:34px;border-radius:50%;border:3px solid #3a3f4b;border-top-color:#d96d2e;
        animation:r 1s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  a{color:#e0825a}
  .dim{color:#9a9590;font-size:12.5px;max-width:300px;text-align:center}
</style>
</head>
<body>
<div class="spin"></div>
<div>正在连接到 carrot…</div>
<a id="go" href="https://happens-morgan-skirt-latex.trycloudflare.com">没自动跳？点这里</a>
<div class="dim">首次连接会要求输入访问密码。电脑关机或休眠时连不上。</div>
<script>
  // 双保险（meta refresh 某些浏览器在后台标签不执行）
  setTimeout(function(){ location.replace("https://happens-morgan-skirt-latex.trycloudflare.com"); }, 600);
</script>
</body>
</html>
